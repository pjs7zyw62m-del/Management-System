const permittedInvite=a=>desk()||a.residentId===demoResident;
const getInvite=id=>data.accessInvites.find(a=>a.id===Number(id));
const validForEntry=a=>desk()&&a&&inviteState(a)==='Active';
function entry(a){
 if(!validForEntry(a))throw Error('Invite is unavailable, expired, revoked or already used.');
 data.guestLogs.unshift({id:uid(),inviteId:a.id,guest:a.guest,residentId:a.residentId,kind:a.kind,in:new Date().toISOString(),out:null});
}
function exit(a){if(!desk())throw Error('Concierge role required.');const row=data.guestLogs.find(l=>l.inviteId===a?.id&&!l.out);if(!row)throw Error('No active visit found.');row.out=new Date().toISOString()}
function createInvite(){
 if(!['Resident','Manager','Concierge'].includes($('role').value))return;
 const now=localDate(),end=localDate(new Date(Date.now()+86400000));
 const fields=[field('guest','Guest name (fictional)'),field('kind','Authorization type','select',{options:['Visitor','Contractor','Delivery','Recurring guest']}),field('start','Valid from','datetime-local',{value:now}),field('end','Valid until','datetime-local',{value:end}),field('policy','Entry allowance','select',{options:['One visit','Multiple visits']}),field('note','Instructions (optional)','textarea',{optional:true})];
 if(desk())fields.unshift(field('resident','Resident','select',{options:residentList.map(r=>r.name+' — '+r.unit)}));
 modal('Create authorization',fields,v=>{
  const start=Date.parse(v.start),end=Date.parse(v.end);if(!v.guest.trim()||!Number.isFinite(start)||!Number.isFinite(end)||end<=start||end<=Date.now())throw Error('Enter a valid guest name and a future end time after the start.');
  const r=desk()?residentList.find(r=>r.name+' — '+r.unit===v.resident):resident(demoResident);if(!r)throw Error('Select a resident.');
  let code;do{code='BC-DEMO-'+String(crypto.getRandomValues(new Uint32Array(1))[0]%100000000).padStart(8,'0')}while(data.accessInvites.some(a=>a.code===code));
  const a={id:uid(),code,guest:v.guest.trim(),residentId:r.id,kind:v.kind,start:v.start,end:v.end,policy:v.policy,note:v.note||'',revoked:false};data.accessInvites.unshift(a);go(desk()?'authorizations':'my-authorizations');toast('Sample authorization created.');
 });
}
function inviteCard(a){
 const state=inviteState(a),r=resident(a.residentId);return '<article class="item concierge-record" data-search="'+escape([a.guest,r?.name,r?.unit,a.code,a.kind,state].join(' ').toLowerCase())+'"><div class="row between"><span class="tag '+(state==='Active'||state==='On property'?'done':state==='Revoked'||state==='Expired'?'urgent':'open')+'">'+escape(state)+'</span><span class="fine">'+escape(a.code)+'</span></div><h3>'+escape(a.guest)+'</h3><p>'+escape(a.kind+' · '+r?.name+' · '+r?.unit)+'</p><div class="fine">'+escape(a.start.replace('T',' ')+' → '+a.end.replace('T',' ')+' · '+a.policy)+'</div><div class="actions">'+btn('View invite / QR','guest-qr:'+a.id)+(desk()&&state==='Active'?btn('Check in','guest-in:'+a.id,'primary'):'')+(desk()&&state==='On property'?btn('Check out','guest-out:'+a.id,'primary'):'')+(!a.revoked&&['Active','Upcoming','On property'].includes(state)?btn('Revoke','guest-revoke:'+a.id):'')+'</div></article>';
}
function logCard(l){
 const r=resident(l.residentId);return '<article class="item concierge-record" data-search="'+escape([l.guest,r?.name,r?.unit,l.kind].join(' ').toLowerCase())+'"><div class="row between"><h3>'+escape(l.guest)+'</h3><span class="tag '+(l.out?'':'done')+'">'+(l.out?'Departed':'On property')+'</span></div><p>'+escape(r?.name+' · '+r?.unit+' · '+l.kind)+'</p><div class="fine">Arrival: '+escape(new Date(l.in).toLocaleString())+(l.out?' · Departure: '+escape(new Date(l.out).toLocaleString()):'')+'</div>'+(!l.out&&desk()?'<div class="actions">'+btn('Check out','guest-out:'+l.inviteId,'primary')+'</div>':'')+'</article>';
}
const searchBox=label=>'<input class="search" id="conciergeSearch" type="search" placeholder="'+escape(label)+'" aria-label="'+escape(label)+'">';
const emptyRecords='<p class="empty">No records in this preview yet.</p>';
function conciergePage(p){
 if(!desk()&&['authorizations','access','guest-logs','scan-invite','residents'].includes(p))p='my-authorizations';
 const mine=data.accessInvites.filter(a=>a.residentId===demoResident);
 const rows=desk()?data.accessInvites:mine;
 if(p==='concierge')return header('Concierge',btn('+ Create authorization','guest-create','primary'))+
 '<div class="hero"><div><div class="flag">PROPERTY SERVICES / VISITOR MANAGEMENT</div><h1>'+ (desk()?'Concierge command center':'Visitor access')+'</h1><p>Manage invitations, guest arrivals and approved visits. All actions in this preview are simulated.</p></div>'+btn(desk()?'Scan invite':'My authorizations','go:'+(desk()?'scan-invite':'my-authorizations'),'primary')+'</div>'+
 '<div class="metrics">'+(desk()?[['authorizations','✓',rows.filter(a=>inviteState(a)==='Active').length,'Active authorizations'],['access','▣',data.guestLogs.filter(l=>!l.out).length,'On property'],['guest-logs','≡',data.guestLogs.length,'Guest logs'],['residents','♙',residentList.length,'Residents']]:[['my-authorizations','✓',mine.length,'My authorizations']]).map(([id,ic,count,label])=>'<button class="metric" data-action="go:'+id+'"><span class="symbol">'+ic+'</span><b>'+count+'</b><small>'+label+'</small></button>').join('')+'</div>'+section(desk()?'Recent authorizations':'My recent authorizations',desk()?'authorizations':'my-authorizations',rows.slice(0,3).map(inviteCard).join('')||emptyRecords);
 if(p==='authorizations'||p==='my-authorizations')return header(p==='authorizations'?'Authorizations':'My authorizations',btn('+ Create authorization','guest-create','primary'))+searchBox('Search visitor, resident or invitation')+(p==='my-authorizations'?mine:rows).map(inviteCard).join('')+(!(p==='my-authorizations'?mine:rows).length?emptyRecords:'');
 if(p==='access')return header('Access control',btn('Scan invite','go:scan-invite','primary'))+'<div class="notice">Simulated desk decisions only. No live gate, door, intercom or security-system integration.</div>'+searchBox('Search active guests')+section('Expected visitors','',rows.filter(a=>inviteState(a)==='Active').map(inviteCard).join('')||emptyRecords)+section('Currently on property','',data.guestLogs.filter(l=>!l.out).map(logCard).join('')||emptyRecords);
 if(p==='guest-logs')return header('Guest logs')+searchBox('Search guest or unit')+section('Arrival and departure history','',data.guestLogs.map(logCard).join('')||emptyRecords);
 if(p==='residents')return header('Residents')+searchBox('Search resident or unit')+residentList.map(r=>'<article class="item concierge-record" data-search="'+escape((r.name+' '+r.unit).toLowerCase())+'"><h3>'+escape(r.name)+'</h3><p>'+escape(r.unit)+'</p><span class="fine">'+data.accessInvites.filter(a=>a.residentId===r.id&&inviteState(a)==='Active').length+' active authorizations · Fictional resident</span></article>').join('');
 if(p==='scan-invite')return header('Scan invite')+'<section class="panel"><div class="notice">Preview invitation QR format: BC-DEMO codes only. Camera scanning depends on browser support. You can always enter the invitation code manually.</div><input id="inviteCode" class="search" maxlength="40" placeholder="Enter invitation code" aria-label="Invitation code" autocomplete="off"><div class="actions">'+btn('Verify code','guest-verify','primary')+btn('Start camera','guest-camera')+btn('Stop camera','guest-stop')+'</div><video id="inviteCamera" hidden playsinline muted style="width:100%;max-height:250px;background:#000;border-radius:10px;margin-top:12px"></video><label>Scan QR from image (supported browsers)<input type="file" id="inviteImage" accept="image/*"></label><p id="scanStatus" class="fine" role="status"></p><div id="scanResult">'+(foundInvite&&getInvite(foundInvite)?inviteCard(getInvite(foundInvite)):'')+'</div></section>';
 return '';
}
function stopInviteCamera(){scanEpoch++;clearInterval(scannerTimer);scannerTimer=null;scannerStream?.getTracks().forEach(t=>t.stop());scannerStream=null;const v=$('inviteCamera');if(v){v.srcObject=null;v.hidden=true}}
function verifyCode(raw){if(!desk()||page!=='scan-invite')return;stopInviteCamera();const code=String(raw||'').trim().toUpperCase();const a=data.accessInvites.find(a=>a.code===code);foundInvite=a?.id||null;render();$('scanStatus').textContent=a?'Invitation found · '+inviteState(a):'No matching preview invitation.'}
async function scanCamera(){
 if(!desk()||page!=='scan-invite')return;stopInviteCamera();const epoch=scanEpoch;const status=$('scanStatus');
 if(!('BarcodeDetector'in window)||!navigator.mediaDevices?.getUserMedia){status.textContent='Camera QR scanning unavailable here. Enter the code manually.';return}
 try{const detector=new BarcodeDetector({formats:['qr_code']}),stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});if(epoch!==scanEpoch||page!=='scan-invite'||!desk()){stream.getTracks().forEach(t=>t.stop());return}scannerStream=stream;const v=$('inviteCamera');v.hidden=false;v.srcObject=stream;await v.play();status.textContent='Point the camera at a preview invitation QR.';let scanning=false;scannerTimer=setInterval(async()=>{if(scanning||epoch!==scanEpoch)return;scanning=true;try{const hits=await detector.detect(v);if(epoch===scanEpoch&&hits.length)verifyCode(hits[0].rawValue)}catch(_){}finally{scanning=false}},400)}catch(e){stopInviteCamera();if($('scanStatus'))$('scanStatus').textContent='Camera unavailable. Use manual code entry.'}
}
async function showInvite(a){
 if(!a||!permittedInvite(a))return;stopInviteCamera();modal('Invitation · '+a.guest,[],()=>{});
 const div=document.createElement('div');div.style.cssText='text-align:center;padding:14px';const code=document.createElement('p');code.textContent=a.code;code.style.cssText='font-size:20px;font-weight:700;letter-spacing:.06em';const qr=document.createElement('div');qr.style.cssText='background:white;color:#111;max-width:190px;min-height:150px;margin:auto;padding:12px;border-radius:9px';const note=document.createElement('p');note.textContent='Demo only · Not a real access credential · '+inviteState(a);div.append(qr,code,note);$('fields').append(div);
 try{const {default:qrcode}=await import('./vendor/blackcell-qrcode.js');const q=qrcode(0,'M');q.addData(a.code,'Byte');q.make();qr.innerHTML=q.createSvgTag({cellSize:4,margin:12,scalable:true});const svg=qr.querySelector('svg');if(svg)svg.style.cssText='display:block;width:100%;height:auto'}catch(_){qr.textContent='QR rendering unavailable. Use code.'}
}
async function guestAction(action,p){
 try{
 if(action==='guest-create'){createInvite();return}
 if(action==='guest-verify'&&desk()){verifyCode($('inviteCode')?.value);return}
 if(action==='guest-camera'){await scanCamera();return}
 if(action==='guest-stop'){stopInviteCamera();return}
 const a=getInvite(p);if(!a||!permittedInvite(a))throw Error('Invitation unavailable.');
 if(action==='guest-qr'){await showInvite(a);return}
 if(action==='guest-in'){entry(a);toast('Sample arrival logged.')}
 if(action==='guest-out'){exit(a);toast('Sample departure logged.')}
 if(action==='guest-revoke'){if(!confirm('Revoke this preview invitation?'))return;a.revoked=true;toast('Invitation revoked.')}
 render();
 }catch(e){toast(e.message||'Preview action unavailable.')}
}
document.addEventListener('input',e=>{if(e.target.id==='conciergeSearch'){const q=e.target.value.toLowerCase().trim();document.querySelectorAll('.concierge-record').forEach(r=>r.hidden=!r.dataset.search.includes(q))}});
document.addEventListener('change',async e=>{if(e.target.id!=='inviteImage'||!desk()||page!=='scan-invite')return;const file=e.target.files?.[0];if(!file)return;const status=$('scanStatus');if(!('BarcodeDetector'in window)){status.textContent='QR image scanning unsupported in this browser. Enter the code manually.';return}let bitmap;const epoch=scanEpoch;try{bitmap=await createImageBitmap(file);const hits=await new BarcodeDetector({formats:['qr_code']}).detect(bitmap);if(epoch!==scanEpoch||page!=='scan-invite'||!desk())return;if(hits.length)verifyCode(hits[0].rawValue);else status.textContent='No QR code detected.'}catch(_){if(epoch===scanEpoch)status.textContent='Unable to scan image. Use manual code entry.'}finally{bitmap?.close();e.target.value=''}});
window.addEventListener('pagehide',stopInviteCamera);
window.BLACKCELL_OS_PAUSE_MEDIA=stopInviteCamera;

render();
window.BLACKCELL_OS_BEFORE_CLOSE=async()=>{stopInviteCamera();return {ok:true,retain:true,message:'Community preview retained in this window.'}};
</script></body></html>
