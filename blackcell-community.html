function conciergePage(p){
 if(!desk()||!['residents','scan-invite'].includes(p))return authWorkspace(p);
 if(p==='residents')return header('Residents',btn('‹ Authorizations','go:access'))+searchBox('Search resident or unit')+residentList.map(r=>'<article class="item concierge-record" data-search="'+escape((r.name+' '+r.unit).toLowerCase())+'"><h3>'+escape(r.name)+'</h3><p>'+escape(r.unit)+'</p><span class="fine">'+data.accessInvites.filter(a=>a.residentId===r.id&&inviteState(a)==='Active').length+' active authorizations · Fictional resident</span></article>').join('');
 if(p==='scan-invite')return header('Scan invite',btn('‹ Authorizations','go:access'))+'<section class="panel"><div class="notice">Preview invitation QR format: BC-DEMO codes only. Camera scanning depends on browser support. You can always enter the invitation code manually.</div><input id="inviteCode" class="search" maxlength="40" placeholder="Enter invitation code" aria-label="Invitation code" autocomplete="off"><div class="actions">'+btn('Verify code','guest-verify','primary')+btn('Start camera','guest-camera')+btn('Stop camera','guest-stop')+'</div><video id="inviteCamera" hidden playsinline muted style="width:100%;max-height:250px;background:#000;border-radius:10px;margin-top:12px"></video><label>Scan QR from image (supported browsers)<input type="file" id="inviteImage" accept="image/*"></label><p id="scanStatus" class="fine" role="status"></p><div id="scanResult">'+(foundInvite&&getInvite(foundInvite)?inviteCard(getInvite(foundInvite)):'')+'</div></section>';
 return '';
}
function stopInviteCamera(){scanEpoch++;clearInterval(scannerTimer);scannerTimer=null;scannerStream?.getTracks().forEach(t=>t.stop());scannerStream=null;const v=$('inviteCamera');if(v){v.srcObject=null;v.hidden=true}}
function verifyCode(raw){if(!desk()||page!=='scan-invite')return;stopInviteCamera();const code=String(raw||'').trim().toUpperCase();const a=data.accessInvites.find(a=>a.code===code);foundInvite=a?.id||null;render();$('scanStatus').textContent=a?'Invitation found · '+inviteState(a):'No matching preview invitation.'}
async function scanCamera(){
 if(!desk()||page!=='scan-invite')return;stopInviteCamera();const epoch=scanEpoch;const status=$('scanStatus');
 if(!('BarcodeDetector'in window)||!navigator.mediaDevices?.getUserMedia){status.textContent='Camera QR scanning unavailable here. Enter the code manually.';return}
 try{const detector=new BarcodeDetector({formats:['qr_code']}),stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});if(epoch!==scanEpoch||page!=='scan-invite'||!desk()){stream.getTracks().forEach(t=>t.stop());return}scannerStream=stream;const v=$('inviteCamera');v.hidden=false;v.srcObject=stream;await v.play();status.textContent='Point the camera at a preview invitation QR.';let scanning=false;scannerTimer=setInterval(async()=>{if(scanning||epoch!==scanEpoch)return;scanning=true;try{const hits=await detector.detect(v);if(epoch===scanEpoch&&hits.length)verifyCode(hits[0].rawValue)}catch(_){}finally{scanning=false}},400)}catch(e){stopInviteCamera();if($('scanStatus'))$('scanStatus').textContent='Camera unavailable. Use manual code entry.'}
}
async function showInvite(a){
 if(!a||!permittedInvite(a))return;stopInviteCamera();modal('Invitation · '+a.guest,[],()=>{});
 const div=document.createElement('div');div.style.cssText='text-align:center;padding:14px';const code=document.createElement('p');code.textContent=a.code;code.style.cssText='font-size:20px;font-weight:700;letter-spacing:.06em';const qr=document.createElement('div');qr.style.cssText='background:white;color:#111;max-width:190px;min-height:150px;margin:auto;padding:12px;border-radius:9px';const note=document.createElement('p');note.textContent='Demo only · Not a real access credential · '+inviteState(a);div.append(qr,code,note);$('fields').append(div);
 try{const {default:qrcode}=await import('./vendor/blackcell-qrcode.js');const q=qrcode(0,'M');q.addData(a.code,'Byte');q.make();qr.innerHTML=q.createSvgTag({cellSize:4,margin:12,scalable:true});const svg=qr.querySelector('svg');if(svg)svg.style.cssText='display:block;width:100%;height:auto'}catch(_){qr.textContent='QR rendering unavailable. Use code.'}
}
async function guestAction(action,p){
 try{
 if(action==='guest-toggle-nav'){conciergeExpanded=!conciergeExpanded;render();return}
 if(action==='guest-today'){visitDay=localDay(new Date());render();return}
 if(action==='guest-prev'||action==='guest-next'){const d=new Date(visitDay+'T12:00:00');d.setDate(d.getDate()+(action==='guest-prev'?-1:1));visitDay=localDay(d);render();return}
 if(action==='guest-sort'){guestAscending=guestSort===p?!guestAscending:true;guestSort=p;refreshAuthTable();return}
 if(action==='guest-export'){exportAuth();return}
 if(action==='guest-settings'){modal('Authorization display',[field('sort','Sort by','select',{options:['Guest name','Authorized by'],value:guestSort==='guest'?'Guest name':'Authorized by'}),field('order','Order','select',{options:['Ascending','Descending'],value:guestAscending?'Ascending':'Descending'})],v=>{guestSort=v.sort==='Guest name'?'guest':'resident';guestAscending=v.order==='Ascending';refreshAuthTable()});return}
 if(action==='guest-create'){createInvite();return}
 if(action==='guest-verify'&&desk()){verifyCode($('inviteCode')?.value);return}
 if(action==='guest-camera'){await scanCamera();return}
 if(action==='guest-stop'){stopInviteCamera();return}
 const a=getInvite(p);if(!a||!permittedInvite(a))throw Error('Invitation unavailable.');
 if(action==='guest-qr'){await showInvite(a);return}
 if(action==='guest-in'){entry(a);toast('Sample arrival logged.')}
 if(action==='guest-out'){exit(a);toast('Sample departure logged.')}
 if(action==='guest-revoke'){if(!confirm('Revoke this preview invitation?'))return;a.revoked=true;toast('Invitation revoked.')}
 render();
 }catch(e){toast(e.message||'Preview action unavailable.')}
}
document.addEventListener('input',e=>{if(e.target.id==='guestKeyword'){guestKeyword=e.target.value;refreshAuthTable();return}if(e.target.id==='conciergeSearch'){const q=e.target.value.toLowerCase().trim();document.querySelectorAll('.concierge-record').forEach(r=>r.hidden=!r.dataset.search.includes(q))}});
document.addEventListener('change',async e=>{if(e.target.id==='visitDay'){if(e.target.value){visitDay=e.target.value;refreshAuthTable();render()}return}if(e.target.id==='hideUnlimited'){hideUnlimited=e.target.checked;refreshAuthTable();return}if(e.target.id!=='inviteImage'||!desk()||page!=='scan-invite')return;const file=e.target.files?.[0];if(!file)return;const status=$('scanStatus');if(!('BarcodeDetector'in window)){status.textContent='QR image scanning unsupported in this browser. Enter the code manually.';return}let bitmap;const epoch=scanEpoch;try{bitmap=await createImageBitmap(file);const hits=await new BarcodeDetector({formats:['qr_code']}).detect(bitmap);if(epoch!==scanEpoch||page!=='scan-invite'||!desk())return;if(hits.length)verifyCode(hits[0].rawValue);else status.textContent='No QR code detected.'}catch(_){if(epoch===scanEpoch)status.textContent='Unable to scan image. Use manual code entry.'}finally{bitmap?.close();e.target.value=''}});
window.addEventListener('pagehide',stopInviteCamera);
window.BLACKCELL_OS_PAUSE_MEDIA=stopInviteCamera;

render();
window.BLACKCELL_OS_BEFORE_CLOSE=async()=>{stopInviteCamera();return {ok:true,retain:true,message:'Community preview retained in this window.'}};
</script></body></html>
