<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>BLACKCELL Community · Preview</title><style>
:root{color-scheme:dark;font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--bg:#08090b;--panel:#141519;--line:#ffffff14;--muted:#9399a5;--red:#e05062;--text:#f5f6f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;background:#22242a;padding:10px 13px}button:hover{background:#30323a}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--red);outline-offset:2px}button.primary{background:#b72b41;border-color:#d6485a;color:white}button:disabled{opacity:.5;cursor:default}.shell{display:grid;grid-template-columns:248px minmax(0,1fr);height:100dvh;overflow:hidden}aside{border-right:1px solid var(--line);background:#101115;display:flex;flex-direction:column;padding:22px 13px;overflow:auto}.brand{letter-spacing:.19em;font-size:10px;color:#aeb1bd;padding:4px 12px 24px}.brand b{display:block;font-size:20px;letter-spacing:.01em;color:white;margin-top:4px}.brand b:before{content:'▥ ';color:var(--red)}.group{color:#777e89;font-size:10px;letter-spacing:.14em;padding:19px 12px 7px}.nav{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;color:#a4a9b4;padding:10px 12px;margin:1px 0;font-weight:550}.nav i{font-style:normal;width:22px;text-align:center;font-size:17px}.nav.active{background:#352027;color:white;box-shadow:inset 3px 0 #db4156}.sidefoot{margin-top:auto;padding:20px 12px 4px;color:var(--muted);font-size:11px}.work{min-width:0;overflow:auto}.top{position:sticky;top:0;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 30px;background:#101115ed;backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.top small{display:block;color:var(--muted);font-size:11px}.top strong{font-size:14px}.account{display:flex;gap:10px;align-items:center}.avatar{display:grid;place-items:center;width:35px;height:35px;border-radius:50%;background:#562b35;color:#ffb7c0;font-weight:700}.role{background:#202127;border:1px solid var(--line);border-radius:8px;padding:8px}main{max-width:1250px;margin:auto;padding:24px 30px 50px}.flag{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#e7a5ad}.hero{border-radius:18px;padding:29px;background:radial-gradient(ellipse at top right,#55242f,transparent 66%),linear-gradient(135deg,#201a21,#101115);border:1px solid #ffffff20;display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:22px}.hero h1{font-size:clamp(26px,4vw,38px);font-weight:650;letter-spacing:-.035em;margin:8px 0}.hero p{color:#c2bdc6;margin:5px 0}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:25px}.metric,.panel,.item{background:var(--panel);border:1px solid var(--line);border-radius:13px}.metric{text-align:left;padding:17px;cursor:pointer}.metric b{display:block;font-size:28px;letter-spacing:-.04em}.metric small,.muted{color:var(--muted)}.metric .symbol{color:#e0838f;font-size:18px}.columns{display:grid;grid-template-columns:1.65fr 1fr;gap:18px}.panel{padding:19px;margin-bottom:17px}.section{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px}.section h2{font-size:19px;margin:0;font-weight:650;letter-spacing:-.02em}.section button{font-size:12px;color:#e6a1ab;border:0;background:transparent;padding:4px}.item{padding:17px;margin:10px 0;overflow-wrap:anywhere}.item h3{margin:5px 0;font-size:16px}.item p{margin:5px 0;white-space:pre-wrap;color:#c4c7ce}.tag{font-size:10px;font-weight:650;letter-spacing:.04em;padding:4px 8px;border-radius:5px;background:#ffffff0d;color:#ccd0d9;display:inline-block}.tag.open{background:#68432245;color:#ffc17b}.tag.done{background:#224b3b;color:#9be0bd}.tag.urgent{background:#672632;color:#ffb2be}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.actions button{font-size:12px}.date{min-width:52px;text-align:center;border:1px solid var(--line);background:#22232a;border-radius:9px;padding:8px;font-weight:650}.date span{display:block;color:var(--red);font-size:10px;text-transform:uppercase}.quick{display:grid;grid-template-columns:1fr 1fr;gap:9px}.quick button{text-align:left;min-height:64px;background:#1b1c22}.quick button span{display:block;color:#e58c99;font-size:18px}.pagehead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.pagehead h1{margin:0;font-size:30px;letter-spacing:-.04em}.sub{font-size:12px;color:var(--muted)}.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:9px;background:#121318;margin-bottom:12px}.empty{color:var(--muted);padding:24px;text-align:center}.notice{background:#292127;border:1px solid #6d3742;color:#f4c0c7;border-radius:9px;padding:10px 13px;margin-bottom:14px;font-size:12px}.pollbar{height:6px;border-radius:4px;background:#ffffff10;margin:6px 0 12px;overflow:hidden}.pollbar span{display:block;background:#c04658;height:100%}.mobile{display:none}.toast{position:fixed;bottom:18px;right:18px;background:#282d32;border:1px solid #ffffff30;padding:13px 18px;border-radius:12px;z-index:20;max-width:min(90vw,380px);box-shadow:0 12px 35px #0006}dialog{background:#18191f;color:var(--text);border:1px solid #3c3d46;border-radius:17px;width:min(480px,94vw);padding:24px}dialog::backdrop{background:#000a;backdrop-filter:blur(5px)}dialog h2{margin:0 0 15px}label{display:block;margin:12px 0;color:#c6c9d2}input,select,textarea{display:block;width:100%;min-height:42px;padding:10px;background:#101115;border:1px solid #373942;border-radius:8px;margin-top:5px}textarea{min-height:85px;resize:vertical}.role{width:auto;margin:0}.money{font-size:34px;font-weight:700;margin:0}.fine{font-size:11px;color:#9297a1}.menu{display:none}@media(max-width:900px){.shell{grid-template-columns:200px minmax(0,1fr)}main{padding:18px}.top{padding:12px 18px}.metrics{grid-template-columns:repeat(2,1fr)}.columns{grid-template-columns:1fr}}@media(max-width:630px){.shell{display:block}.work{height:100dvh;padding-bottom:70px}aside{display:none;position:fixed;inset:0 25% 0 0;z-index:12;box-shadow:0 0 0 100vw #0008}aside.open{display:flex}.menu{display:block;background:transparent;border:0;padding:6px}.top{padding:10px 12px}.account .avatar{display:none}.hero{padding:20px;display:block}.hero button{margin-top:12px}.hero h1{font-size:25px}.metric{padding:13px}main{padding:15px}.pagehead h1{font-size:25px}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:6;background:#15161a;border-top:1px solid var(--line);justify-content:space-around;padding:4px 2px max(4px,env(safe-area-inset-bottom))}.mobile button{background:transparent;border:0;font-size:10px;color:#aaa;flex:1}.mobile button.active{color:#ff8594}.mobile i{display:block;font-size:19px;font-style:normal}.row{gap:7px}}
</style></head><body><div class="shell"><aside id="sidebar"><div class="brand">BLACKCELL CORPORATION<b>Community</b></div><div id="navigation"></div><div class="sidefoot">DEVELOPMENT PREVIEW<br>Sample community · No live data</div></aside><div class="work" id="workspace"><header class="top"><div class="row"><button class="menu" id="menu" aria-label="Menu">☰</button><div><small>COMMUNITY MANAGEMENT</small><strong>BLACKCELL Residential Community</strong></div></div><div class="account"><select id="role" class="role" aria-label="Preview role"><option>Resident</option><option>Manager</option></select><div class="avatar">BC</div></div></header><main id="main"></main></div></div><nav class="mobile" id="mobile"></nav><div class="toast" id="toast" hidden role="status"></div><dialog id="modal"><form id="form"><h2 id="formTitle"></h2><div id="fields"></div><div class="actions" style="justify-content:flex-end"><button type="button" id="cancel">Cancel</button><button type="submit" class="primary">Save</button></div></form></dialog><script>
'use strict';const $=id=>document.getElementById(id);const nav=[['COMMUNITY','home','⌂','Home'],['','announcements','◉','Announcements'],['','forum','▤','Community Forum'],['','messages','✉','Messages'],['','events','▦','Events'],['SERVICES','requests','◷','Requests'],['','reservations','◫','Reservations'],['','documents','▧','Documents'],['','polls','◒','Polls & Voting'],['','billing','$','Account & Billing'],['','directory','♙','Directory']];let page='home',manager=false,handler=null;const seed={announcements:[{id:1,title:'Welcome to your community',body:'Your new community portal brings announcements, services and neighbors into one convenient place.',kind:'Community update',date:'Nov 14'},{id:2,title:'Holiday common area hours',body:'Please review the upcoming seasonal hours before making amenity reservations.',kind:'Notice',date:'Nov 12'}],requests:[{id:101,title:'Gate access inquiry',body:'Please review the access instructions for the main gate.',kind:'General inquiry',status:'In progress'},{id:102,title:'Exterior lighting',body:'Light near the clubhouse is not working.',kind:'Maintenance',status:'Open'}],forum:[{id:201,title:'Community landscaping ideas',body:'What improvements would you like to see in our shared outdoor spaces?',author:'Community Office',comments:['More shade trees would be great.']}],events:[{id:301,title:'Community meeting',date:'2026-11-20',body:'Clubhouse · 6:00 PM'},{id:302,title:'Neighborhood cleanup',date:'2026-11-22',body:'Meet at the main entrance · 9:00 AM'}],reservations:[],documents:[{id:401,title:'Community welcome guide',body:'Sample document: welcome information, contact details and common area guidelines.'},{id:402,title:'Amenity rules',body:'Sample document: operating hours and reservation guidelines.'}],polls:[{id:501,title:'Which community event should we host next?',options:['Community picnic','Movie night','Volunteer day'],votes:[12,8,4],choice:null}],messages:[{id:601,title:'Community Office',body:'Welcome! Send us a message if you need assistance.',author:'Community Office'}]};let data=structuredClone(seed);const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>Date.now()+Math.floor(Math.random()*1000);function toast(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').hidden=true,3200)}function btn(label,action,cls=''){return `<button type="button" class="${cls}" data-action="${action}">${label}</button>`}function go(p){page=p;render();$('workspace').scrollTop=0;$('sidebar').classList.remove('open')}function stamp(){return new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'})}function bodyText(s){return `<p>${escape(s)}</p>`}function header(title,action=''){return `<div class="pagehead"><div><div class="flag">BLACKCELL COMMUNITY</div><h1>${title}</h1></div>${action}</div>`}function item(title,body,extra='',tag=''){return `<article class="item">${tag?`<span class="tag">${escape(tag)}</span>`:''}<h3>${escape(title)}</h3>${bodyText(body)}${extra}</article>`}function section(title,link,content){return `<section class="panel"><div class="section"><h2>${title}</h2>${link?btn('View all →','go:'+link):''}</div>${content}</section>`}function requestCard(r){return `<article class="item"><div class="row between"><span class="tag ${r.status==='Resolved'?'done':'open'}">${escape(r.status)}</span><span class="fine">REQ-${r.id.toString().slice(-5)}</span></div><h3>${escape(r.title)}</h3>${bodyText(r.body)}<div class="fine">${escape(r.kind)}</div>${manager?`<div class="actions">${btn('In progress','status:'+r.id+':In progress')}${btn('Resolve','status:'+r.id+':Resolved')}</div>`:''}</article>`}function eventCard(e){const d=new Date(e.date+'T12:00:00');return `<article class="item row"><div class="date"><span>${d.toLocaleDateString('en-US',{month:'short'})}</span>${d.getDate()}</div><div><h3>${escape(e.title)}</h3><p>${escape(e.body)}</p></div></article>`}function render(){const n=nav.map(([group,id,ic,label])=>`${group?`<div class="group">${group}</div>`:''}<button type="button" class="nav ${page===id?'active':''}" data-action="go:${id}"><i>${ic}</i>${label}</button>`).join('');$('navigation').innerHTML=n;$('mobile').innerHTML=nav.filter(x=>['home','forum','requests','events','messages'].includes(x[1])).map(([,id,ic,label])=>`<button class="${page===id?'active':''}" data-action="go:${id}"><i>${ic}</i>${label.split(' ')[0]}</button>`).join('');let h='';const ann=a=>item(a.title,a.body,`<div class="fine">Community Office · ${escape(a.date)}</div>`,a.kind);
if(page==='home'){h=`<div class="hero"><div><div class="flag">COMMUNITY / RESIDENT PORTAL</div><h1>${manager?'Community command center':'Welcome home.'}</h1><p>${manager?'Oversee community updates, requests and operations.':'Everything happening in your community, in one place.'}</p></div>${btn(manager?'Post announcement':'Create a request',manager?'new:announcements':'new:requests','primary')}</div><div class="metrics">${[['requests','◷',data.requests.filter(r=>r.status!=='Resolved').length,'Open requests'],['announcements','◉',data.announcements.length,'Announcements'],['events','▦',data.events.length,'Upcoming events'],['billing','$','$125','Sample balance']].map(([id,ic,count,label])=>`<button class="metric" data-action="go:${id}"><span class="symbol">${ic}</span><b>${count}</b><small>${label}</small></button>`).join('')}</div><div class="columns"><div>${section('Community announcements','announcements',data.announcements.slice(0,2).map(ann).join(''))}${section('My requests','requests',data.requests.slice(0,2).map(requestCard).join(''))}</div><div>${section('Quick access','',`<div class="quick">${[['requests','＋','New request'],['reservations','◫','Reserve amenity'],['documents','▧','Documents'],['polls','◒','Vote']].map(([p,ic,l])=>`<button data-action="${p==='requests'?'new:requests':'go:'+p}"><span>${ic}</span>${l}</button>`).join('')}</div>`)}${section('Upcoming events','events',data.events.slice(0,2).map(eventCard).join(''))}</div></div>`}
else if(page==='announcements'){h=header('Announcements',manager?btn('+ New announcement','new:announcements','primary'):'')+data.announcements.map(ann).join('')}
else if(page==='requests'){h=header('Service requests',btn('+ Submit request','new:requests','primary'))+data.requests.map(requestCard).join('')}
else if(page==='forum'){h=header('Community Forum',btn('+ New discussion','new:forum','primary'))+data.forum.map(r=>item(r.title,r.body,`<div class="fine">${escape(r.author)}</div>${r.comments.map(c=>`<div class="notice" style="margin:9px 0">${escape(c)}</div>`).join('')}<div class="actions">${btn('Reply','reply:'+r.id)}</div>`)).join('')}
else if(page==='events'){h=header('Events & Calendar',manager?btn('+ Create event','new:events','primary'):'')+data.events.map(eventCard).join('')}
else if(page==='reservations'){h=header('Amenity reservations',btn('+ Reserve amenity','new:reservations','primary'))+section('Available amenities','',['Clubhouse','Pool pavilion','Community meeting room'].map(x=>item(x,'Request a reservation for your preferred date.',`<div class="actions">${btn('Reserve','reserve:'+x)}</div>`)).join(''))+section('My reservations','',data.reservations.map(r=>item(r.title,r.date+' · '+r.body,`<div class="actions">${btn('Cancel','cancel:'+r.id)}</div>`,'Requested')).join('')||'<p class="empty">No reservations yet.</p>')}
else if(page==='documents'){h=header('Community documents',manager?btn('+ Add document note','new:documents','primary'):'')+`<div class="notice">Sample text documents only. Secure PDF/file upload and cloud permissions are not connected.</div>`+data.documents.map(r=>item(r.title,r.body)).join('')}
else if(page==='polls'){h=header('Polls & Voting',manager?btn('+ Create poll','new:polls','primary'):'')+'<div class="notice">Informal demonstration polls only. Not official or legally binding ballots.</div>'+data.polls.map(p=>item(p.title,'Community survey',p.options.map((o,i)=>{let v=p.votes[i],t=p.votes.reduce((a,b)=>a+b,0)||1;return `<div class="row between"><span>${escape(o)}</span>${p.choice===null?btn('Vote','vote:'+p.id+':'+i):`<span>${v} votes${p.choice===i?' · Your choice':''}</span>`}</div>${p.choice!==null?`<div class="pollbar"><span style="width:${v/t*100}%"></span></div>`:''}`}).join(''))).join('')}
else if(page==='messages'){h=header('Messages',btn('+ New message','new:messages','primary'))+'<div class="notice">Messages are simulated locally, not delivered to another person.</div>'+data.messages.map(r=>item(r.title,r.body,`<div class="fine">${escape(r.author)}</div>`)).join('')}
else if(page==='billing'){h=header('Account & Billing')+'<div class="notice">Illustrative statement. No real balance, payment processing or banking integration.</div>'+section('Sample account balance','',`<p class="money">$125.00</p><p class="muted">Monthly assessment · Example only</p><button disabled>Pay balance — not connected</button>`)+section('Statement','',item('Community assessment','Example monthly charge: $125.00', '', 'Sample'))}
else if(page==='directory'){h=header('Community directory')+section('Community contacts','',item('Community Office','Management · General questions')+item('Maintenance Team','Service requests · Common areas')+item('Board of Directors','Community governance'))+'<p class="fine">Fictional role-based directory, not personal resident records.</p>'}
$('main').innerHTML='<div class="notice">Interactive prototype · Fictional data · Changes reset on reload · '+(manager?'Manager':'Resident')+' view</div>'+h;}
function modal(title,fields,onSave){$('formTitle').textContent=title;$('fields').replaceChildren();for(const f of fields){const label=document.createElement('label');label.textContent=f.label;const el=document.createElement(f.type==='textarea'?'textarea':f.type==='select'?'select':'input');if(f.type==='select')for(const v of f.options){const o=document.createElement('option');o.value=v;o.textContent=v;el.append(o)}else if(f.type!=='textarea')el.type=f.type||'text';el.name=f.name;el.required=true;el.maxLength=1500;if(f.value)el.value=f.value;label.append(el);$('fields').append(label)}handler=onSave;$('modal').showModal()}
const field=(name,label,type='text',extra={})=>({name,label,type,...extra});function create(p,defaultValue=''){let f=[field('title','Title'),field('body','Details','textarea')];if(p==='requests')f.push(field('kind','Category','select',{options:['Maintenance','General inquiry','Architectural request','Security concern']}));if(p==='events'||p==='reservations')f.push(field('date','Date','date'));if(p==='reservations')f=[field('title','Amenity','select',{options:['Clubhouse','Pool pavilion','Community meeting room'],value:defaultValue}),field('date','Date','date'),field('body','Preferred time / purpose')];if(p==='polls')f=[field('title','Poll question'),field('options','Choices (comma separated)')];modal('New '+({announcements:'announcement',requests:'request',forum:'discussion',events:'event',reservations:'reservation',documents:'document note',polls:'poll',messages:'message'}[p]),f,v=>{const r={...v,id:uid(),date:v.date||stamp(),author:'Demo member',kind:v.kind||'Community update',status:'Open',comments:[]};if(p==='polls'){r.options=v.options.split(',').map(x=>x.trim()).filter(Boolean).slice(0,8);if(r.options.length<2)throw Error('Enter at least two choices.');r.votes=r.options.map(()=>0);r.choice=null}if(p==='reservations'&&data.reservations.some(x=>x.title===r.title&&x.date===r.date&&x.body===r.body))throw Error('This reservation is already requested.');data[p].unshift(r);go(p);toast('Saved in this preview.')})}
$('form').onsubmit=e=>{e.preventDefault();try{handler(Object.fromEntries(new FormData($('form'))));$('modal').close()}catch(err){toast(err.message)}};$('cancel').onclick=()=>$('modal').close();$('role').onchange=e=>{manager=e.target.value==='Manager';render()};$('menu').onclick=()=>$('sidebar').classList.toggle('open');document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const [action,p,arg]=b.dataset.action.split(':');if(action==='go')go(p);if(action==='new'){if(['announcements','events','documents','polls'].includes(p)&&!manager)return;create(p)}if(action==='reserve')create('reservations',p);if(action==='cancel'){data.reservations=data.reservations.filter(r=>r.id!==+p);render();toast('Reservation canceled.')}if(action==='status'&&manager){const r=data.requests.find(x=>x.id===+p);if(r){r.status=arg;render();toast('Request updated.')}}if(action==='reply')modal('Reply',[field('body','Your reply','textarea')],v=>{data.forum.find(x=>x.id===+p).comments.push(v.body);render();toast('Reply added.')});if(action==='vote'){const r=data.polls.find(x=>x.id===+p);if(r&&r.choice===null){r.choice=+arg;r.votes[+arg]++;render();toast('Vote recorded in preview.')}}});render();
window.BLACKCELL_OS_BEFORE_CLOSE=async()=>({ok:true,retain:true,message:'Community preview retained in this window.'});
</script></body></html>
