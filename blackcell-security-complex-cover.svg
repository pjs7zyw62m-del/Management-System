<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 510" role="img" aria-label="Cinematic BLACKCELL high-security complex at night with guard tower and red warning lights">
<defs>
 <linearGradient id="sky" x1="0" x2=".7" y1="0" y2="1"><stop stop-color="#111b27"/><stop offset=".44" stop-color="#243341"/><stop offset="1" stop-color="#06090f"/></linearGradient>
 <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#26303a"/><stop offset=".4" stop-color="#141b24"/><stop offset="1" stop-color="#060910"/></linearGradient>
 <linearGradient id="gate" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2c333d"/><stop offset=".7" stop-color="#090d15"/><stop offset="1" stop-color="#08090d"/></linearGradient>
 <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c4324b" stop-opacity=".83"/><stop offset="1" stop-color="#420813" stop-opacity="0"/></linearGradient>
 <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8d9caa" stop-opacity=".15"/><stop offset="1" stop-color="#c3c4cc" stop-opacity="0"/></linearGradient>
 <radialGradient id="spot"><stop stop-color="#e2e8fa" stop-opacity=".7"/><stop offset=".23" stop-color="#e5ebf5" stop-opacity=".3"/><stop offset="1" stop-color="#e5ebf5" stop-opacity="0"/></radialGradient>
 <radialGradient id="beacon"><stop stop-color="#ff4c64" stop-opacity=".9"/><stop offset=".18" stop-color="#dc1f37" stop-opacity=".6"/><stop offset="1" stop-color="#d21835" stop-opacity="0"/></radialGradient>
 <pattern id="grain" width="81" height="73" patternUnits="userSpaceOnUse"><path d="M0 16h81M11 0v73M0 64h81M68 0v73" stroke="#a5bac4" stroke-opacity=".035" stroke-width="1"/><circle cx="29" cy="42" r=".85" fill="#fff" opacity=".1"/><circle cx="71" cy="18" r=".75" fill="#fff" opacity=".06"/></pattern>
