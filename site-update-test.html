<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>BLACKCELL | Update Demonstration</title><style>
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;min-height:100dvh;background:#000;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}main{text-align:center;width:min(440px,100%);padding:24px}h1{font-size:clamp(24px,5vw,32px);letter-spacing:.19em;margin:0}small{display:block;font-size:10px;color:#aaa;letter-spacing:.4em;margin:8px 0 38px}.rule{height:1px;background:linear-gradient(90deg,transparent,#dd172d,transparent);margin:24px 0}h2{font-size:18px;letter-spacing:.12em;margin:24px 0 12px}button{display:block;width:min(210px,100%);min-height:49px;margin:25px auto 18px;border:1px solid #ef334a;border-radius:9px;background:linear-gradient(130deg,#740811,#ce172d);color:#fff;font:800 11px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.11em;cursor:pointer;box-shadow:0 0 25px #b70f241f}button:disabled{opacity:.5;cursor:default}button:focus-visible{outline:2px solid white;outline-offset:4px}p{font-size:12px;color:#a9a9af;line-height:1.65}#bcTestResult{min-height:40px;color:#ddd}#bcManifestResult{font-size:10px;color:#777;overflow-wrap:anywhere}footer{font-size:9px;color:#777;letter-spacing:.2em;margin-top:32px}</style></head><body><main><h1>BLACKCELL</h1><small>CORPORATION</small><div class="rule"></div><h2>LIVE UPDATE DEMONSTRATION</h2><p>Launch the actual website update animation and reload this exact page. This test affects only this tab.</p><button id="bcRunUpdateTest" disabled type="button">TEST SITE UPDATE</button><p id="bcTestResult" role="status" aria-live="polite">Initializing update engine…</p><p id="bcManifestResult">Checking deployed release…</p><footer>CONTROL IS EVERYTHING.</footer></main><script data-test="true" data-mode="auto">/* BLACKCELL site update system. Same-origin only; no credentials or drafts are saved. */
(function(){
'use strict';
if(window.top!==window.self||window.BLACKCELL_LIVE_UPDATE)return;
const testMode=document.currentScript?.dataset.test==='true'&&/\/site-update-test(?:-v2)?\.html$/.test(location.pathname), KEY='bc.live-update.v1';
let testing=false,baseline='',pending='',checking=false,refreshing=false,last=Date.now(),interrupted=false,screen=null;
const dirty=new Map(),original=new WeakMap(),holds=new Map(),$=id=>document.getElementById(id);
for(const e of ['pointerdown','keydown','wheel','touchstart'])addEventListener(e,()=>{last=Date.now();interrupted=true},{capture:true,passive:true});
function editable(t){return t instanceof Element&&t.matches('input:not([type=hidden]):not([type=button]):not([type=submit]):not([type=reset]),textarea,select,[contenteditable=true]')}
function value(t){if(t.type==='file')return t.files?.length||0;if(t.type==='checkbox'||t.type==='radio')return t.checked;if(t.isContentEditable)return t.textContent;return t.value}
function defaultValue(t){if(t.type==='file')return 0;if(t.type==='checkbox'||t.type==='radio')return t.defaultChecked;if(t.tagName==='SELECT')return Array.from(t.options).find(o=>o.defaultSelected)?.value??t.options[0]?.value??'';if(t.isContentEditable)return '';return t.defaultValue??''}
document.addEventListener('focusin',e=>{const t=e.target;if(editable(t)&&!dirty.has(t))original.set(t,value(t))},true);
function track(e){const t=e.target;if(editable(t)){if(!dirty.has(t))dirty.set(t,original.has(t)?original.get(t):defaultValue(t));if(value(t)===dirty.get(t))dirty.delete(t)}}
document.addEventListener('input',track,true);document.addEventListener('change',track,true);
window.BLACKCELL_LIVE_UPDATE=Object.freeze({hold(reason='operation',owner=window){const t=Symbol(reason);holds.set(t,owner);return()=>holds.delete(t)},clean(element){if(element&&typeof element.contains==='function')for(const t of dirty.keys())if(t===element||element.contains(t)){dirty.delete(t);original.set(t,value(t))}},check:()=>void check()});
function activityDoc(doc,depth=0){
 if(!doc||depth>3)return false;
 if(doc.querySelector('[aria-busy=true],.is-uploading,[data-busy=true],progress:not([value])'))return true;
 const visible=e=>!!(e.getClientRects().length&&!e.closest('[hidden],[aria-hidden=true]')&&e.ownerDocument.defaultView.getComputedStyle(e).visibility!=='hidden');
 for(const el of doc.querySelectorAll('video,audio')){
  if(el.ended)continue;
  if(!el.paused||((el.currentTime>0||el.id==='bcCinemaPlayer')&&visible(el)&&!!(el.currentSrc||el.getAttribute('src'))))return true;
 }
 for(const frame of doc.querySelectorAll('iframe')){
  const src=frame.getAttribute('src')||'';
  if(src&&src!=='about:blank'&&visible(frame)&&(/stream|player|youtube|vimeo|video|bunny/i.test(src)||frame.id==='bcCinemaStreamPlayer'))return true;
  try{if(frame.contentDocument&&activityDoc(frame.contentDocument,depth+1))return true}catch(_){}
 }
 return false;
}
function busy(){for(const [token,owner] of holds){try{if(owner.closed||owner!==window&&owner.top!==window)holds.delete(token)}catch(_){holds.delete(token)}}return holds.size>0||activityDoc(document)}

function modified(){for(const [t,initial] of dirty){if(!t.isConnected||value(t)===initial){dirty.delete(t);original.delete(t)}}return dirty.size>0||Array.from(document.querySelectorAll('input[type=file]')).some(t=>t.files?.length)}
function openModal(){return Array.from(document.querySelectorAll('dialog[open],[aria-modal=true]:not([hidden]):not([aria-hidden=true])')).some(t=>t.getClientRects().length)}
function safe(){return !document.hidden&&navigator.onLine&&!busy()&&!modified()&&!openModal()&&Date.now()-last>=12000}
function maybeRefresh(){if(pending&&!refreshing&&safe())void refresh()}
function styles(){const s=document.createElement('style');s.textContent=
'#bc-update-overlay{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;color:#f5f5f5;z-index:2147483000;line-height:1.5}#bc-update-overlay *{box-sizing:border-box}'+
'#bc-update-overlay{position:fixed;inset:0;background:#000;display:grid;place-items:center;padding:24px;text-align:center}#bc-update-overlay .bc-up-body{width:min(460px,100%);display:grid;justify-items:center;gap:15px}'+
'#bc-update-overlay .bc-up-brand{font-size:clamp(19px,5vw,29px);letter-spacing:.34em;font-weight:800;color:#eee}#bc-update-overlay .bc-up-corp{font-size:10px;letter-spacing:.47em;color:#aaa;margin-top:-12px}'+
'#bc-update-overlay .bc-up-ring{width:112px;height:112px;border-radius:50%;border:2px solid #292929;border-top-color:#ff2038;border-right-color:#ac0b1c;box-shadow:0 0 32px #ae0a262c;animation:bcupdspin 1.35s linear infinite;margin:22px 0 7px}'+
'#bc-update-overlay h2{font-size:24px;letter-spacing:.14em;color:#fff;margin:0}#bc-update-overlay p{font-size:12px;color:#aaa;margin:0}#bc-update-overlay .bc-up-track{width:80%;height:4px;background:#222;overflow:hidden;border-radius:8px;margin-top:8px}#bc-update-overlay .bc-up-track i{display:block;width:36%;height:4px;background:#ed1230;animation:bcupdscan 1.45s ease-in-out infinite}#bc-update-overlay .bc-up-foot{border-top:1px solid #272727;padding-top:21px;margin-top:18px;width:100%;font-size:9px;letter-spacing:.25em;color:#777}'+
'@keyframes bcupdspin{to{transform:rotate(360deg)}}@keyframes bcupdscan{0%{transform:translateX(-100%)}100%{transform:translateX(380%)}}@media(prefers-reduced-motion:reduce){#bc-update-overlay .bc-up-ring,#bc-update-overlay .bc-up-track i{animation:none}}';document.head.append(s)}
styles();
function overlay(message){if(!screen){screen=document.createElement('div');screen.id='bc-update-overlay';screen.setAttribute('role','status');screen.innerHTML='<div class="bc-up-body"><div class="bc-up-brand">BLACKCELL</div><div class="bc-up-corp">CORPORATION</div><div class="bc-up-ring" aria-hidden="true"></div><h2>SITE UPDATING</h2><p id="bc-up-message"></p><div class="bc-up-track" aria-hidden="true"><i></i></div><p>Preserving your current location</p><div class="bc-up-foot">CONTROL IS EVERYTHING.</div></div>';document.body.append(screen)}$('bc-up-message').textContent=message}
function save(){try{const scroll=Array.from(document.querySelectorAll('[id]')).filter(t=>t.clientHeight>0&&t.scrollHeight>t.clientHeight+4&&t.scrollTop>0).slice(0,30).map(t=>({id:t.id,top:t.scrollTop,left:t.scrollLeft}));sessionStorage.setItem(KEY,JSON.stringify({path:location.pathname,at:Date.now(),x:scrollX,y:scrollY,scroll}))}catch(_){}}
function restore(){let r;try{r=JSON.parse(sessionStorage.getItem(KEY)||'null');sessionStorage.removeItem(KEY)}catch(_){return}if(!r||r.path!==location.pathname||Date.now()-r.at>60000||performance.getEntriesByType('navigation')[0]?.type!=='reload')return;
interrupted=false;overlay('Restoring your corporate workspace…');const move=()=>{if(interrupted||location.pathname!==r.path)return;scrollTo(r.x||0,r.y||0);for(const item of r.scroll||[]){const el=$(item.id);if(el){el.scrollTop=item.top;el.scrollLeft=item.left}}};
move();setTimeout(move,300);setTimeout(move,1100);setTimeout(()=>{screen?.remove();screen=null;move()},1500);setTimeout(move,2600)}
async function refresh(){if(refreshing||!pending||(testing?busy():!safe()))return;refreshing=true;overlay('Applying the latest corporate system update…');await new Promise(r=>setTimeout(r,testing?3200:850));if(testing?busy():!safe()){screen?.remove();screen=null;refreshing=false;return}save();if(testing){try{sessionStorage.setItem('bc.live-update.test-complete',location.pathname+location.search+location.hash)}catch(_){}}location.reload()}
async function version(){const url=new URL('blackcell-site-version.json',location.href);url.searchParams.set('_bc',String(Date.now()));const r=await fetch(url,{cache:'no-store',credentials:'same-origin'});if(!r.ok)throw Error('Version unavailable');const text=await r.text(),json=JSON.parse(text.slice(text.indexOf('{'),text.lastIndexOf('}')+1));const rev=String(json.revision||'');if(/^[a-f0-9]{7,64}$/i.test(rev))return rev;const build=String(json.built||'');if(/^\d{14}$/.test(build))return build;return String(json.fallback||'')}
async function check(){if(checking||refreshing||document.hidden||!navigator.onLine)return;checking=true;try{const v=await version();if(!v)return;if(!baseline){baseline=v;return}pending=v!==baseline?v:'';if(pending)maybeRefresh()}catch(_){/* fail open */}finally{checking=false}}
if(testMode){
 const button=$('bcRunUpdateTest');
 const output=$('bcTestResult');
 if(output)output.textContent='UPDATE ENGINE READY — click RUN UPDATE TEST.';
 if(button)button.disabled=false;
 if($('bcManifestResult'))void version().then(v=>{$('bcManifestResult').textContent='Deployed release: '+(v||'unavailable')}).catch(()=>{$('bcManifestResult').textContent='Release manifest unavailable; local animation test is still available.'});
 button?.addEventListener('click',()=>{
  if(refreshing)return;
  if(busy()){if(output)output.textContent='Test paused: an active operation is blocking refresh.';return;}
  testing=true;pending='local-test';button.disabled=true;if(output)output.textContent='Running the real update engine…';void refresh().catch(()=>{button.disabled=false;if(output)output.textContent='Update test failed during refresh.'});
 });
 try{if(sessionStorage.getItem('bc.live-update.test-complete')===location.pathname+location.search+location.hash&&performance.getEntriesByType('navigation')[0]?.type==='reload'){
  sessionStorage.removeItem('bc.live-update.test-complete');
  $('bcTestResult').textContent='TEST COMPLETE — returned to the same page after refresh.';
 }}catch(_){}
}
restore();if(!testMode){void check();setInterval(()=>void check(),30000);setInterval(maybeRefresh,2000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)void check()});addEventListener('online',()=>void check());}
})();
</script></body></html>
