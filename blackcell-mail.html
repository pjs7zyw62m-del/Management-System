<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>BLACKCELL Mail</title><link rel="icon" type="image/svg+xml" href="blackcell-mail-icon.svg?v=20261128-1"><link rel="stylesheet" href="blackcell-mail.css?v=2"><script src="corp-config.js" defer></script><script type="module" src="blackcell-mail.js?v=1"></script></head><body>
<header><div class="brand"><img class="logo" src="blackcell-mail-icon.svg?v=20261128-1" alt=""><div><strong>BLACKCELL Mail</strong><small>PRIVATE CORPORATE NETWORK</small></div></div><button id="refresh" disabled>Refresh</button><button id="compose" class="primary" disabled>✎ Compose</button></header>
<p id="status" role="status" aria-live="polite">Verifying corporate access…</p>
<main id="mail" hidden><nav id="folders" aria-label="Mail folders"></nav><section class="listing"><div class="listhead"><h1 id="folderTitle">Inbox</h1><span id="count"></span></div><form id="searchForm"><input id="search" type="search" placeholder="Search mail" aria-label="Search mail" maxlength="160"><button>Search</button></form><div id="items"></div><div id="pages"><button id="prev">Previous</button><button id="next">Next</button></div></section><article id="reader"><div id="reading" class="empty">Select a message to read it.</div></article></main>
<dialog id="editor"><form id="draftForm"><div class="composeHead"><h2>New message</h2><button type="button" id="closeEditor" aria-label="Close compose">×</button></div><label>From <output id="fromAddress"></output></label><label>To <select id="recipient"><option value="">Choose a member</option></select></label><label>Subject <input id="subject" maxlength="200" autocomplete="off"></label><textarea id="body" maxlength="20000" placeholder="Write your message…" aria-label="Message"></textarea><p class="muted">Internal mail only. No external email or attachments in this release.</p><p id="composeStatus" role="status"></p><div class="composeFoot"><button type="button" id="save">Save draft</button><button class="primary" id="send" type="submit">Send</button></div></form></dialog>
</body></html>
