let selectedPhotoFile=null;async function uploadNexusPhoto(file, inmateId) {
  const { data: { user }, error: authError } =
    await nexusDB.auth.getUser();

  if (authError || !user) {
    throw new Error('Please sign in before uploading a photo.');
  }

  if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
    throw new Error('Only JPEG, PNG, and WebP photos are allowed.');
  }

  if (file.size > 1500000) {
    throw new Error('Photo must be smaller than 1.5 MB.');
  }

  const extension = {
    'image/jpeg': 'jpg',
    'image/png': 'png',
    'image/webp': 'webp'
  }[file.type];

  const path = user.id + '/' + crypto.randomUUID() + '.' + extension;

  const { data, error } = await nexusDB.storage
    .from(NEXUS_PHOTO_BUCKET)
    .upload(path, file, {
      contentType: file.type,
      upsert: false
    });

  if (error) {
    throw new Error('Photo upload failed: ' + error.message);
  }

  return data.path;
}

            async function saveMasterToSupabase(p){
  const {data:{user},error} = await nexusDB.auth.getUser();

  if(error || !user){
    throw new Error('Please sign in to save a Master Record.');
  }
  let uploadedPhotoPath = null;

  if (selectedPhotoFile) {
    uploadedPhotoPath = await uploadNexusPhoto(
      selectedPhotoFile,
      p.id
    );
  }
    const record = {
    owner_id: user.id,
    inmate_id: p.id,
    photo_path: uploadedPhotoPath || p.photo_path || null,
    first_name: p.first || null,
    middle_name: p.middle || null,
    last_name: p.last || null,
    age: p.age === '' ? null : Number(p.age) || null,
    state: p.state || null,
    facility: p.facility || null,
    status: p.status || 'Active',
    admission_date: p.admission || null,
    earliest_release_date: p.earliestRelease || null,
    projected_release_date: p.release || null,
    custody_classification: p.custody || null,
    most_recent_location: p.location || null,
    mailing_address: p.mailing || null,
    notes: p.notes || null
  };

  const {data, error: saveError} = await nexusDB
    .from('nexus_profiles')
    .upsert(record, {onConflict: 'owner_id,inmate_id'})
    .select()
    .single();

  if(saveError){
    throw new Error('Supabase save failed: ' + saveError.message);
  }
  const sectionRows = [];

  for (const section of tableDefs) {
    const rows = p[section.key] || [];

    rows.forEach((row, index) => {
      sectionRows.push({
        owner_id: user.id,
        profile_id: data.id,
        section_type: section.key,
        row_position: index,
        row_data: { cells: row }
      });
    });
  }

  const { error: sectionError } = await nexusDB
    .rpc('nexus_replace_master_sections', {
      p_profile_id: data.id,
      p_rows: sectionRows
    });

  if (sectionError) {
    throw new Error(
      'Could not save Master Record sections: ' + sectionError.message
    );
  }
  const previousPhotoPath=p.previous_photo_path;
  p.photo_path = data.photo_path;
  delete p.previous_photo_path;
  if(p.photo_path){
    try{p.photo=await signedPhotoUrl(p.photo_path)}catch(err){console.warn(err.message);p.photo=''}
  }
  if(uploadedPhotoPath && previousPhotoPath && previousPhotoPath!==uploadedPhotoPath){
    const {error:cleanupError}=await nexusDB.storage.from(NEXUS_PHOTO_BUCKET).remove([previousPhotoPath]);
    if(cleanupError)console.warn('Old photo cleanup failed:',cleanupError.message);
  }
  return data;
}

function nexusNormalize(str){
 return String(str||'').normalize('NFKC').toLowerCase()
   .replace(/[’‘]/g,"'")
   .replace(/[\u200b-\u200d\ufeff]/g,'')
   .replace(/[@]/g,'a').replace(/0/g,'o').replace(/3/g,'e')
   .replace(/[$]/g,'s').replace(/[!1]/g,'i')
   .replace(/([a-z])\1{3,}/g,'$1$1')
   .replace(/[^a-z0-9'*\s]+/g,' ')
   .replace(/\s+/g,' ').trim();
}

 return Array.isArray(v)?v.filter(x=>x&&typeof x.term==='string'&&x.term.length<=80&&Number.isInteger(x.points)&&Math.abs(x.points)<=5).slice(0,100):[];
}
function nexusAllRules(){
 const old=NEXUS_CUE_RULES.map((r,i)=>({key:'base'+i,label:r.label,points:r.points,regex:r.terms}));
 const extra=NEXUS_EXTRA_CUES.map((r,i)=>({key:'extra'+i,label:r.label,points:r.points,terms:r.terms}));
 const custom=nexusCustomTerms().map(x=>({key:'custom'+x.id,label:x.category||'Custom phrases',points:x.points,terms:[x.term],custom:true}));
 return [...old,...extra,...custom,{key:'respectOriginal',label:'Respectful / considerate language',points:-1,regex:NEXUS_RESPECT_TERMS}];
}
function nexusPhraseCount(text,terms){
 const txt=nexusNormalize(text),matches=[];
 for(const term of terms){
  const phrase=nexusNormalize(term);
  if(!phrase)continue;
  const escaped=phrase.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const re=new RegExp('(?:^|[^a-z0-9])('+escaped+')(?![a-z0-9])','gi');
  let m;
  while((m=re.exec(txt))!==null){matches.push(m[1]);if(matches.length>=8)break;}
 }
 return matches;
}
function nexusCueScore(){
 const entries=(file().entries||[]).filter(e=>String(e.message||'').trim());
 const rules=nexusAllRules(),ignored=file().cueIgnored||{};
 const counts=rules.map(()=>0),hits=[],scores=rules.map(()=>0);
 for(const entry of entries){
  const txt=String(entry.message||'');
  rules.forEach((rule,i)=>{
   const matches=[];
   for(const re of rule.regex||[]){
    const found=txt.match(re)||[];
    matches.push(...found.slice(0,3));
   }
   if(rule.terms)matches.push(...nexusPhraseCount(txt,rule.terms));
   const seen=[...new Set(matches.map(x=>String(x).toLowerCase()))].slice(0,2);
   for(const phrase of seen){
    const key=String(entry.uid||entry.date)+':'+rule.key+':'+phrase;
    if(ignored[key])continue;
    hits.push({key,rule:rule.label,phrase,points:rule.points,date:entry.date,type:entry.type,uid:entry.uid});
    counts[i]++;
    scores[i]+=rule.points;
   }
  });
 }
 const total=scores.reduce((a,b)=>a+b,0);
 const level=entries.length?Math.min(5,Math.max(1,Math.ceil(Math.max(0,total)/8)||1)):0;
 return {entries:entries.length,rules,counts,scores,hits,total,level};
}

let facState='',facPrison='',facFacility='',facQuery='';
const FAC_PHOTO_KEY='nexus_facility_photos_local_v1';
function facEntries(){
  const map=new Map();
  profiles.forEach(p=>{
    const state=String(p.state||'Unspecified state').trim();
    const facility=String(p.facility||'Unassigned facility').trim();
    const prison=facility; // Existing records store facility but not a separate prison field.
    const key=JSON.stringify([state,prison,facility]);
    if(!map.has(key))map.set(key,{state,prison,facility,people:[]});
    map.get(key).people.push(p);
  });
  return [...map.values()].sort((a,b)=>(a.state+a.facility).localeCompare(b.state+b.facility));
}
function facKey(e){return JSON.stringify([e.state,e.prison,e.facility])}
function facChoice(entries){
  let selected=entries.find(e=>e.state===facState&&e.prison===facPrison&&e.facility===facFacility);
  if(!selected){selected=entries[0]||null;if(selected){facState=selected.state;facPrison=selected.prison;facFacility=selected.facility}}
  return selected;
}
function facOptions(values,current){return values.map(v=>`<option value="${esc(v)}" ${v===current?'selected':''}>${esc(v)}</option>`).join('')}
// Wikimedia Commons images are public, and may not exist for every institution.
// Manual exterior photos always take precedence over automatic results.
const FAC_AUTO_CACHE=new Map();
function facNameTokens(s){
 return String(s||'').toLowerCase().normalize('NFKD').replace(/[^a-z0-9 ]/g,' ').split(/\s+/)
  .filter(t=>t.length>2&&!['the','and','state','prison','correctional','facility','complex','center','institution','federal','unit','rehabilitation'].includes(t));
}
async function facFindPublicPhoto(e){
 const k=facKey(e);
 if(FAC_AUTO_CACHE.has(k))return FAC_AUTO_CACHE.get(k);
 const query='"'+e.facility+'"';
 const params=new URLSearchParams({action:'query',format:'json',origin:'*',generator:'search',gsrsearch:query,gsrnamespace:'6',gsrlimit:'15',prop:'imageinfo',iiprop:'url|mime',iiurlwidth:'1200'});
 try{
  const response=await fetch('https://commons.wikimedia.org/w/api.php?'+params.toString(),{mode:'cors',credentials:'omit'});
  if(!response.ok)throw new Error('Image service unavailable');
  const data=await response.json();
  const pages=Object.values(data.query?.pages||{});
  const signature=facNameTokens(e.facility);
  const matches=pages.map(page=>{
   const info=page.imageinfo?.[0];
   if(!info||!/^image\/(jpeg|png|webp)$/.test(info.mime||''))return null;
   const title=String(page.title||'').replace(/^File:/i,'');
   const tokens=facNameTokens(title);
   const hits=signature.filter(t=>tokens.includes(t)).length;
   // No guessing from generic 'prison' or state names alone.
   const required=Math.max(1,Math.ceil(signature.length*0.8));
   if(!signature.length||hits<required)return null;
   return {url:info.thumburl||info.url,source:info.descriptionurl,score:hits,title};
  }).filter(Boolean).sort((a,b)=>b.score-a.score);
  const result=matches[0]||null;
  FAC_AUTO_CACHE.set(k,result);
  return result;
 }catch(err){console.warn('Public facility photo lookup failed:',err);return null;}
}
async function facUpdateAutomaticPhoto(e){
 const k=facKey(e);
 const hero=$('facAutoHero');
 if(!hero||hero.dataset.key!==k)return;
 const found=await facFindPublicPhoto(e);
 const current=$('facAutoHero');
 if(!current||current.dataset.key!==k||view!=='facilities')return;
 if(read(FAC_PHOTO_KEY,{})[k])return; // Never overwrite a manual photo.

 if(!found){if(status)status.textContent='No confidently matched public photo found. You may upload your own.';return;}
 const img=document.createElement('img');
 img.className='fcx-photo';img.alt='Public image potentially showing '+e.facility;
 img.referrerPolicy='no-referrer';img.loading='lazy';img.src=found.url;
 img.onerror=()=>{img.remove();if(status)status.textContent='Public image could not be loaded. Upload your own photo.';};
 const art=current.querySelector('.fcx-art');if(art)art.remove();
 current.prepend(img);
 if(status){status.textContent='Public photo suggestion: verify the institution before relying on this image. Source: ';
   if(found.source){const link=document.createElement('a');link.href=found.source;link.target='_blank';link.rel='noopener noreferrer';link.textContent='Wikimedia Commons file and license';status.append(link);}}
}

}const p={...(old||{})};p.previous_photo_path=old?.photo_path||null;for(const [k,v] of fd.entries())if(k!=='photo')p[k]=String(v);p.id=id;p.photo=old?.photo||'';for(const t of tableDefs)p[t.key]=(tableRows[t.key]||old?.[t.key]||[]).filter(r=>Array.isArray(r)?r.some(x=>String(x||'').trim()):Object.values(r||{}).some(x=>String(x||'').trim()));try {
  await saveMasterToSupabase(p);
} catch (err) {

  return;
}if(old){const idx=profiles.indexOf(old);profiles[idx]=p;if(editId!==id&&personal[editId]){personal[id]=personal[editId];delete personal[editId];savePersonal()}}else profiles.push(p);if(saveProfiles()){detailId=id;editId=null;photoData='';selectedPhotoFile=null;tableRows={};go('detail');alert('Master Record saved successfully, including all entered section rows.')}
  }catch(error){showMasterSaveError('Unexpected save error: '+(error?.message||String(error)))}

}

date')||''),category:String(fd.get('category')||''),evidence:String(fd.get('evidence')||''),interpretation:String(fd.get('interpretation')||'')});savePersonal();render()}});

if(b.dataset.delete){
  const id=decodeURIComponent(b.dataset.delete);

  if(!confirm('Permanently delete this Master Record and its associated sections?')){
    return;
  }

  const {data:{user},error: authError} = await nexusDB.auth.getUser();

  if(authError || !user){
    alert('Please sign in before deleting a Master Record.');
    return;
  }

  const {data: deletedRows,error: deleteError} = await nexusDB
    .from('nexus_profiles')
    .delete()
    .eq('owner_id',user.id)
    .eq('inmate_id',id)
    .select('id');

  if(deleteError){
    alert('Supabase deletion failed: '+deleteError.message);
    return;
  }

  if(!deletedRows || deletedRows.length===0){
    alert('No matching Master Record was deleted from Supabase. Local data was left unchanged.');
    return;
  }

  const removedProfile=find(id);
  if(removedProfile?.photo_path){
    const {error:photoDeleteError}=await nexusDB.storage.from(NEXUS_PHOTO_BUCKET).remove([removedProfile.photo_path]);
    if(photoDeleteError)alert('Record deleted, but its stored photograph could not be removed: '+photoDeleteError.message);
  }
  profiles=profiles.filter(p=>p.id!==id);
  delete personal[id];
  saveProfiles();
  savePersonal();
  go('profiles');
  alert('Master Record deleted from Supabase and this browser.');
  return;
}

  e.preventDefault();

  const inputs = $('loginForm').querySelectorAll('input');
  const email = inputs[0].value.trim();

    await nexusDB.auth.signOut();
