<style>

d label{color:#a5bad4;font-size:12px}input,select,textarea{width:100%;background:#0a1423;color:#fff;border:1px solid #3b5675;border-radius:6px;padding:10px}textarea{resize:vertical;min-height:85px}.muted{color:#9eb2ca;font-size:13px}.photo{width:185px;height:215px;object-fit:contain;background:#202c3c;border-radius:7px}.photo.placeholder{display:grid;place-items:center;color:#9bacc1;font-size:52px}.hero{display:flex;align-items:center;gap:22px;flex-wrap:wrap}.hero h2{font-size:34px;margin:0 0 6px}.state{color:#31a5ff;font-size:22px;font-weight:800;margin-bottom:15px}.facts{display:flex;flex-wrap:wrap;gap:22px}.fact{min-width:95px;border-right:1px solid #30425b;padding-right:16px}.fact small{display:block;color:#9eb2ca;margin-bottom:7px}.fact strong{font-size:15px}.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:15px}.tab{background:#1b2b40;border:1px solid #30445d;color:#e2ecfa;border-radius:5px;padding:11px 13px}.tab.active{background:#176cdd;border-color:#176cdd}.info{background:#0b1726;border:1px solid #263d56;border-radius:6px;padding:12px;min-width:0}.info small{display:block;color:#9db3d0;margin-bottom:7px}.info strong{overflow-wrap:anywhere}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}.profile{background:#101d2d;border:1px solid #294360;border-radius:9px;overflow:hidden}.profile-photo{width:100%;height:250px;object-fit:contain;background:#1b2635;display:block}.idbar{background:#6b1d32;text-align:center;padding:8px;font-weight:bold}.profile-body{text-align:center;padding:13px}.profile-body h3{margin:0 0 7px}.profile-body .state{font-size:14px;margin:0 0 10px;letter-spacing:2px}.status{display:inline-block;background:#167e4a;padding:5px 10px;border-radius:20px;font-size:12px}.status.inactive{background:#842c40}.indicator{display:flex;align-items:center;gap:13px;font-size:30px;font-weight:900}.dot{width:23px;height:23px;border-radius:50%;flex-shrink:0}.low{color:#ff575e}.medium{color:#ffd12b}.high{color:#3bd88b}.dot.low{background:#ff575e}.dot.medium{background:#ffd12b}.dot.high{background:#3bd88b}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.stat{background:#0b1726;border:1px solid #30445b;padding:13px;border-radius:7px;text-align:center}.stat strong{display:block;font-size:26px;margin:7px}.entry{border-bottom:1px solid #2c3c52;padding:11px 0}.entry:last-child{border:0}.entry p{white-space:pre-wrap;overflow-wrap:anywhere}.section-title{color:#51b2ff;font-size:16px;font-weight:800;margin:22px 0 10px}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:9px;border:1px solid #30435c;text-align:left;vertical-align:top}th{background:#173453}td input{min-width:135px}.bar{height:9px;background:#293a50;border-radius:10px;overflow:hidden;margin-top:10px}.fill{height:100%;background:#ffd12b}.notice{padding:11px;border:1px solid #395779;border-radius:6px;background:#122842;color:#b8d5ff}.alertbox{background:#381c29;border:1px solid #7e3248;border-radius:7px;padding:11px}.chart{display:flex;align-items:end;gap:14px;height:140px;border-bottom:1px solid #54708e;padding:10px}.chart-col{flex:1;text-align:center;min-width:0}.chart-bar{width:70%;max-width:45px;margin:auto;background:#2187e9;border-radius:4px 4px 0 0;min-height:2px}.chart-label{font-size:11px;color:#9db3cd;margin-top:5px}.right{display:flex;align-items:center;gap:10px}.right button{white-space:nowrap}@media(max-width:850px){.shell{grid-template-columns:1fr}.sidebar{display:flex;overflow-x:auto;align-items:center;padding:9px;gap:5px}.sidebar .logo{font-size:20px;margin:0 10px}.nav{width:auto;white-space:nowrap;font-size:12px}.cols{grid-template-columns:1fr}.hero h2{font-size:26px}.content{padding:12px}.topbar{padding:12px}.photo{width:140px;height:170px}}@media(max-width:480px){.stats{gap:5px}.stat{padding:8px}.stat strong{font-size:20px}.hero{gap:12px}.facts{gap:10px}.fact{padding-right:9px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.pr </style></head><body>
<div id="gateway" class="gate"><form id="gateForm" class="panel"><div class="logo">NE<span>X</span>US</div><h2>Security Gateway</h2><p class="muted">Demonstration access only</p><div class="field"><label>Security Key</label><input required autocomplete="off"></div><div class="field"><label>Access Code</label><input required type="password"></div><button class="btn" type="submit">CONTINUE</button></form></div>
<div id="login" class="gate hidden"><form id="loginForm" class="panel"><div class="logo">NE<span>X</span>US</div><h2>Administrator Login</h2><div class="field"><label>Username</label><input required autocomplete="username"></div><div class="field"><label>Password</label><input required type="password" autocomplete="current-password"></div><button class="btn" type="submit">LOGIN</button></form></div>
<div id="shell" class="shell hidden"><aside class="sidebar"><div class="logo">NE<span>X</span>US</div><button class="nav active" data-view="dashboard">▦ Dashboard</button><button class="nav" data-view="profiles">♙ Inmate Profiles</button><button class="nav" data-view="register">＋ Registration</button><button class="nav" data-view="gallery">▧ Photo Gallery</button><button class="nav" data-view="facilities">▤ Facilities</button><button class="nav" data-view="records">▤ Records</button><button class="nav" data-view="search">⌕ Search</button><button class="nav" data-view="reports">▥ Reports</button><button class="nav" data-view="settings">⚙ Settings</button></aside><main class="main"><header class="topbar"><h1 id="pageTitle">Command Dashboard</h1><div class="right"><button class="bell" id="bell" title="Notifications (coming soon)" aria-label="Notifications">🔔</button><button class="btn alt small" id="lock">Log Out</button></div></header><div class="content" id="content"></div></main></div>
<script>
(function(){'use strict';
const $=id=>document.getElementById(id),KEY='nexus_demo_profiles_v2',PERSONAL_KEY='nexus_personal_files_v1';
const tableDefs=[{key:'sentences',title:'COMMITMENT AND SENTENCE INFORMATION',cols:['Commit #','Sentence Length','Sentence County','Court Cause #','Offense Date','Sentence Date','Sentence Status','Crime']},{key:'infractions',title:'DISCIPLINARY INFRACTIONS',cols:['Violation Date','Infraction','Verdict Date','Verdict']},{key:'appeals',title:'DISCIPLINARY APPEALS',cols:['Appeal Date','Outcome Description','As Of Date']},{key:'classifications',title:'PROFILE CLASSIFICATION',cols:['Complete Date','Classification Type','Custody Risk','Internal Risk']},{key:'parole',title:'PAROLE ACTION',cols:['Action Date','Action','Outcome','As Of Date']},{key:'work',title:'WORK PROGRAM',cols:['Assigned Date','Completed Date','Work Assignment']},{key:'detainers',title:'NOTIFICATION REQUESTS, DETAINERS AND WARRANTS',cols:['Detainer Date','Detainer Type','Charges','Authority','Agreement Date']}];
function read(k,fallback){try{return JSON.parse(localStorage.getItem(k)||'null')??fallback}catch{return fallback}}
let profiles=read(KEY,[]),personal=read(PERSONAL_KEY,{}),view='dashboard',detailId=null,editId=null,personalTab='details',photoData='',tableRows={},filter='',windowDays=30,analysisVisible=false;
if(!Array.isArray(profiles))profiles=[];if(!personal||typeof personal!=='object'||Array.isArray(personal))personal={};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fullName=p=>[p.first,p.middle,p.last].filter(Boolean).join(' '),displayName=p=>[p.last,p.first].filter(Boolean).join(', ').toUpperCase(),find=id=>profiles.find(p=>p.id===id);
const photo=p=>p&&/^data:image\/(png|jpeg|webp);base64,/i.test(p.photo||'')?`<img class="photo" src="${p.photo}" alt="Profile photograph">`:'<div class="photo placeholder">♙</div>';
const saveProfiles=()=>store(KEY,profiles),savePersonal=()=>store(PERSONAL_KEY,personal);
function store(key,data){try{localStorage.setItem(key,JSON.stringify(data));return true}catch(e){alert('Could not save to browser storage. Try using a smaller photo or exporting a backup.');return false}}
function file(){if(!personal[detailId])personal[detailId]={details:{},entries:[],created:new Date().toISOString()};if(!Array.isArray(personal[detailId].entries))personal[detailId].entries=[];return personal[detailId]}
function field(label,key,value='',type='text'){return `<div class="field"><label>${esc(label)}</label><input name="${esc(key)}" type="${type}" value="${esc(value)}"></div>`}
function area(label,key,value=''){return `<div class="field"><label>${esc(label)}</label><textarea name="${esc(key)}">${esc(value)}</textarea></div>`}
function item(label,value){return `<div class="info"><small>${esc(label)}</small><strong>${esc(value||'—')}</strong></div>`}
function section(title,body){return `<div class="section-title">${esc(title)}</div><div class="panel">${body}</div>`}
function tableEditor(t,p){const raw=p&&Array.isArray(p[t.key])?p[t.key]:[];const rows=tableRows[t.key]||raw;return `<div class="section-title">${t.title}</div><div class="panel"><div class="tablewrap"><table><thead><tr>${t.cols.map(c=>`<th>${esc(c)}</th>`).join('')}<th></th></tr></thead><tbody id="tb-${t.key}">${rows.map((r,i)=>tableRow(t,r,i)).join('')}</tbody></table></div><button type="button" class="btn alt small" data-add="${t.key}" style="margin-top:10px">+ Add Row</button></div>`}
function tableRow(t,row,i){return `<tr>${t.cols.map((c,j)=>`<td><input data-table="${t.key}" data-row="${i}" data-col="${j}" value="${esc(Array.isArray(row)?row[j]:row&&typeof row==='object'?(row[c]??Object.values(row)[j]):'')}"></td>`).join('')}<td><button type="button" class="btn danger small" data-remove="${t.key}" data-index="${i}">×</button></td></tr>`}
function profileCard(p){return `<article class="profile"><div>${photo(p).replace('class="photo"','class="profile-photo"').replace('class="photo placeholder"','class="profile-photo placeholder"')}</div><div class="idbar">ID: ${esc(p.id)}</div><div class="profile-body"><h3>${esc(displayName(p))}</h3><div class="state">${esc((p.state||'STATE NOT SET').toUpperCase())}</div><div class="status ${p.status==='Inactive'?'inactive':''}">${esc(p.status||'Active')}</div><p><button class="btn small" data-open="${encodeURIComponent(p.id)}">VIEW MASTER RECORD</button></p></div></article>`}
function profileCards(list){return list.length?`<div class="cards">${list.map(profileCard).join('')}</div>`:'<div class="panel muted">No demo profiles found. Select Registration to create one.</div>'}
function registration(){const p=editId?find(editId):null;return `<div class="actions"><button class="btn alt" data-view="profiles">Back to Profiles</button></div><form id="recordForm"><div class="panel"><div class="heading">${p?'EDIT INMATE MASTER RECORD':'INMATE REGISTRATION'}</div><div class="hero"><div>${photo(p)}<div class="muted">INMATE ID BELOW PHOTO</div><div style="font-weight:bold">${esc(p?.id||'New record')}</div><input type="file" id="photoInput" accept="image/png,image/jpeg,image/webp" style="max-width:185px;margin-top:8px"></div><div style="flex:1;min-width:240px"><div class="grid">${field('Inmate ID','id',p?.id||'')}${field('First Name','first',p?.first||'')}${field('Middle Name / Initial','middle',p?.middle||'')}${field('Last Name','last',p?.last||'')}${field('State','state',p?.state||'')}${field('Facility','facility',p?.facility||'')}${field('Date of Birth','dob',p?.dob||'','date')}${field('Age','age',p?.age||'','number')}${field('Admission Date','admission',p?.admission||'','date')}${field('Earliest Release Date','earliestRelease',p?.earliestRelease||'','date')}${field('Projected Release Date','release',p?.release||'','date')}${field('Custody Classification','custody',p?.custody||'')}${field('Most Recent Location','location',p?.location||'')}${field('Mailing Address','mailing',p?.mailing||'')}</div><div class="field"><label>Status</label><select name="status"><option ${p?.status!=='Inactive'?'selected':''}>Active</option><option ${p?.status==='Inactive'?'selected':''}>Inactive</option></select></div>${area('Master Record Notes','notes',p?.notes||'')}</div></div></div>${tableDefs.map(t=>tableEditor(t,p)).join('')}<button class="btn" type="submit">SAVE MASTER RECORD</button></form>`}
function tableDisplay(p,t){const rows=Array.isArray(p[t.key])?p[t.key]:[];return section(t.title,rows.length?`<div class="tablewrap"><table><thead><tr>${t.cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${t.cols.map((c,i)=>`<td>${esc(Array.isArray(r)?r[i]:(r?.[c]??Object.values(r||{})[i]??''))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<p class="muted">No entries recorded.</p>')}
function identity(p,personalMode=false){const d=personal[p.id]?.details||{};return `<div class="panel hero">${photo(p)}<div style="flex:1;min-width:230px"><h2>${esc(displayName(p))}</h2><div class="state">${esc((p.state||'STATE NOT SET').toUpperCase())}</div><div class="facts"><div class="fact"><small>Inmate ID</small><strong>${esc(p.id)}</strong></div>${personalMode?'':`<div class="fact"><small>Date of Birth</small><strong>${esc(p.dob||'—')}</strong></div>`}<div class="fact"><small>Age</small><strong>${esc(p.age||'—')}</strong></div>${personalMode?`<div class="fact"><small>Orientation</small><strong>${esc(d.orientation||'Not provided')}</strong></div>`:''}<div class="fact"><small>Facility</small><strong>${esc(p.facility||'—')}</strong></div></div></div><div><span class="status">${personalMode?'PERSONAL FILE':esc(p.status||'Active')}</span><p class="muted">${personalMode?'Separate from Master Record':'Official Master Record'}</p></div></div>`}
function detail(){const p=find(detailId);if(!p)return '<p>Record not found.</p>';return `<div class="actions"><button class="btn alt" data-view="profiles">BACK</button><button class="btn" data-edit="${encodeURIComponent(p.id)}">EDIT RECORD</button><button class="btn purple" data-personal="${encodeURIComponent(p.id)}">INMATE PERSONAL</button><button class="btn danger" data-delete="${encodeURIComponent(p.id)}">DELETE RECORD</button></div>${identity(p)}${section('PERSONAL / CUSTODY DETAILS',`<div class="grid">${[['First Name',p.first],['Middle Name',p.middle],['Last Name',p.last],['State',p.state],['Date of Birth',p.dob],['Age',p.age],['Facility',p.facility],['Custody Classification',p.custody],['Admission Date',p.admission],['Earliest Release',p.earliestRelease],['Projected Release',p.release],['Most Recent Location',p.location],['Mailing Address',p.mailing],['Notes',p.notes]].map(([a,b])=>item(a,b)).join('')}</div>`)}${tableDefs.map(t=>tableDisplay(p,t)).join('')}`}
function personalDetails(){const d=file().details||{};const fields=[['Preferred Name / Nickname','nickname'],['Hometown','hometown'],['Orientation (optional; self-reported)','orientation'],['Pronouns (optional)','pronouns'],['Marital Status','marital'],['Children','children'],['Languages','languages'],['Education Level','education'],['Religion (optional)','religion']];return `<form id="personalForm"><div class="cols"><div>${section('BASIC INFORMATION',`<div class="grid">${fields.map(([a,b])=>field(a,b,d[b]||'')).join('')}</div>`)}</div><div>${section('ABOUT ME / BIOGRAPHY',area('Biography','bio',d.bio||''))}${section('INTERESTS & HOBBIES',area('Interests and Activities','hobbies',d.hobbies||''))}${section('PERSONAL GOALS',area('Goals','goals',d.goals||''))}${section('ADDITIONAL INFORMATION',area('Personal Notes','additional',d.additional||''))}</div></div><button class="btn" type="submit">SAVE PERSONAL DETAILS</button></form>`}
const today=()=>new Date().toISOString().slice(0,10);
function stats(){const entries=file().entries,now=Date.now(),ms=86400000;const inWindow=(days,offset=0)=>entries.filter(e=>{const t=new Date(e.date+'T12:00:00').getTime();return t<=now-offset*ms&&t>now-(days+offset)*ms});const recent=inWindow(windowDays),previous=inWindow(windowDays,windowDays),rate=recent.length*30/windowDays,prevRate=previous.length*30/windowDays;const level=rate<5?'LOW':rate<15?'MEDIUM':'HIGH',cls=level.toLowerCase(),change=prevRate?Math.round((rate-prevRate)/prevRate*100):null;const last=entries.map(e=>new Date(e.date+'T12:00:00').getTime()).filter(t=>t<=now).sort((a,b)=>b-a)[0];return {recent,previous,level,cls,change,rate,days:last?Math.floor((now-last)/ms):null,counts:{Text:recent.filter(e=>e.type==='Text').length,Email:recent.filter(e=>e.type==='Email').length,Call:recent.filter(e=>e.type==='Call').length}}}
function activity(){const s=stats();return `<div class="panel"><div class="heading">COMMUNICATION ACTIVITY <span style="float:right;font-weight:normal">${windowDays} DAYS</span></div><div class="actions">${[7,30,90].map(d=>`<button class="btn small ${windowDays===d?'':'alt'}" data-window="${d}">${d} Days</button>`).join('')}</div><div class="indicator ${s.cls}"><span class="dot ${s.cls}"></span>${s.level}</div><p class="muted">${s.recent.length} entries in the last ${windowDays} days ${s.change===null?'· No prior-period baseline':`· ${s.change>=0?'+':''}${s.change}% compared with previous ${windowDays} days`}</p><div class="bar"><div class="fill" style="width:${Math.min(100,s.rate/15*100)}%;background:${s.cls==='low'?'#ff575e':s.cls==='medium'?'#ffd12b':'#3bd88b'}"></div></div><div class="stats" style="margin-top:15px"><div class="stat">💬<strong>${s.counts.Text}</strong><small>Texts</small></div><div class="stat">✉<strong>${s.counts.Email}</strong><small>Emails</small></div><div class="stat">☎<strong>${s.counts.Call}</strong><small>Calls</small></div></div><p class="muted">Days since last recorded communication: <strong>${s.days===null?'No entries':s.days}</strong></p><p class="muted">Thresholds per 30 days: LOW 0–4, MEDIUM 5–14, HIGH 15+. These measure recorded activity, not mental health or trustworthiness.</p></div>`}
function communication(){const e=file().entries.slice().sort((a,b)=>b.date.localeCompare(a.date));return `<div class="cols"><div>${activity()}<div class="panel"><div class="heading">ADD COMMUNICATION ENTRY</div><form id="entryForm"><div class="field"><label>Communication Type</label><select name="type"><option value="Text">Text Message</option><option value="Email">Email</option><option value="Call">Phone Call</option></select></div>${field('Communication Date','date',today(),'date')}${area('Message or Call Summary','message')}<button class="btn" type="submit">SAVE ENTRY</button></form></div></div><div><div class="panel"><div class="heading">COMMUNICATION HISTORY</div>${e.length?e.map(x=>`<div class="entry"><strong>${esc(x.type)} · ${esc(x.date)}</strong><p>${esc(x.message)}</p><button class="btn danger small" data-entry-delete="${esc(x.uid)}">Delete Entry</button></div>`).join(''):'<p class="muted">No communication entries yet.</p>'}</div></div></div>`}
function advisor(){const s=stats(),declining=s.change!==null&&s.change<0;return `<div class="cols"><div>${activity()}<div class="panel"><div class="heading">COMMUNICATION REVIEW</div><p class="muted">The AI Advisor is a preview. No messages are sent to OpenAI, and this site does not perform a psychological evaluation.</p><button class="btn purple" id="analyze">✦ ANALYZE COMMUNICATION</button></div></div><div><div class="panel"><div class="heading">NEXUS AI COMMUNICATION ADVISOR</div>${analysisVisible?`<h3 class="${s.cls}">Current Activity: ${s.level}</h3><p>${s.recent.length} entries recorded in the last ${windowDays} days.</p>${declining?'<div class="alertbox">↘ Trend: Declining compared with the previous observation period.</div>':`<div class="notice">Trend: ${s.change===null?'Insufficient previous-period data':s.change>0?'Increasing':'Stable'}.</div>`}<h3 style="color:#54aaff">Suggested Next Steps</h3><p>Review the dates of recent messages and stated communication preferences. If communication has slowed, consider a friendly, low-pressure check-in. Avoid assuming the reason for a change in activity.</p><h3 style="color:#54aaff">Example Message</h3><p>“Hey, just checking in. Hope everything is going well. No pressure to reply right away.”</p><p class="muted">Activity counts cannot determine someone's motives, sincerity, emotions, or psychological condition. A qualified professional is needed for a clinical evaluation.</p>`:'<p class="muted">Select Analyze Communication to display a sample rule-based summary of the saved entry counts.</p>'}</div></div></div>`}
 
const money=n=>'$'+(Math.round((Number(n)||0)*100)/100).toFixed(2);
const activityTypes=[['Text','Text Message'],['Email','Email'],['Call','Phone Call'],['Sexual','Reported Sexual Activity']];
function financeFile(){const f=file();if(!f.rates)f.rates={Text:0,Email:0,Call:0,Sexual:0};if(!Array.isArray(f.sexualEntries))f.sexualEntries=[];if(!Array.isArray(f.deposits))f.deposits=[];if(!Array.isArray(f.maleReports))f.maleReports=[];return f}
function billable(){const f=financeFile();return [...f.entries.map(x=>({...x,billType:x.type})),...f.sexualEntries.map(x=>({...x,billType:'Sexual'}))]}
function amountFor(x){const f=financeFile();return Number.isFinite(Number(x.amount))&&x.amount!==undefined?Math.max(0,Number(x.amount)):Math.max(0,Number(f.rates[x.billType])||0)}
function balanceData(){const f=financeFile(),settled=new Set(f.deposits.flatMap(d=>d.entryIds||[])),all=billable(),pending=all.filter(x=>!settled.has(x.uid));return {all,pending,outstanding:pending.reduce((a,x)=>a+amountFor(x),0),deposited:f.deposits.reduce((a,d)=>a+Number(d.amount||0),0)}}
function sexualPage(){const f=financeFile(),e=f.sexualEntries.slice().sort((a,b)=>b.date.localeCompare(a.date));return `<div class="cols"><div>${section('REPORTED SEXUAL ACTIVITY',`<p class="muted">Record only voluntarily disclosed information. Do not infer orientation or activity from communications.</p><div class="stats"><div class="stat"><strong>${e.reduce((a,x)=>a+Number(x.occurrences||1),0)}</strong><small>Reported occurrences</small></div><div class="stat"><strong>${e.length}</strong><small>Saved entries</small></div></div><form id="sexualForm">${field('Date','date',today(),'date')}<div class="field"><label>Number of occurrences reported</label><input name="occurrences" type="number" min="1" max="100" value="1" required></div>${area('Voluntary report / context','message')}<button class="btn" type="submit">SAVE ACTIVITY ENTRY</button></form>`)}</div><div>${section('SEXUAL INTERESTS & BOUNDARIES',`<form id="interestsForm">${area('Voluntarily disclosed interests / turn-ons','interests',f.details?.interests||'')}${area('Stated boundaries','boundaries',f.details?.boundaries||'')}<button class="btn">SAVE INTERESTS</button></form>`)}${section('SEXUAL ACTIVITY HISTORY',e.length?e.map(x=>`<div class="entry"><strong>${esc(x.date)} · ${Number(x.occurrences||1)} occurrence(s) · ${money(amountFor({...x,billType:'Sexual'}))}</strong><p>${esc(x.message)}</p><button class="btn danger small" data-sex-delete="${esc(x.uid)}">Delete</button></div>`).join(''):'<p class="muted">No activity entries.</p>')}</div></div>`}
function malePage(){const f=financeFile();return `<div class="cols"><div>${section('MALE ACTIVITY REPORT',`<p class="muted">Document specific observed or self-reported actions; separate facts from interpretations. This is not a diagnosis or personality score.</p><form id="maleForm"><div class="field"><label>Category</label><select name="category"><option>Follow-through</option><option>Boundaries</option><option>Initiative</option><option>Emotional Expression</option><option>Relationship Dynamics</option><option>Personal Routine</option></select></div>${field('Date','date',today(),'date')}${area('Evidence / observed statement','evidence')}${area('Interpretation and alternative explanations','interpretation')}<button class="btn">SAVE REPORT ENTRY</button></form>`)}</div><div>${section('OBSERVATION HISTORY',f.maleReports.length?f.maleReports.slice().reverse().map(x=>`<div class="entry"><strong>${esc(x.category)} · ${esc(x.date)}</strong><p>${esc(x.evidence)}</p><p class="muted">Interpretation: ${esc(x.interpretation)}</p></div>`).join(''):'<p class="muted">No reports yet.</p>')}</div></div>`}
function financialPage(){const f=financeFile(),b=balanceData();return `<div class="panel"><div class="heading">AUTOMATED FINANCIAL MANAGEMENT</div><p class="muted">Each inmate has individual rates. Activity entries generate a calculated balance automatically. Recording a deposit logs it and clears the pending balance; it does not transfer money.</p><div class="stats"><div class="stat"><small>OUTSTANDING</small><strong style="color:#3bd88b">${money(b.outstanding)}</strong></div><div class="stat"><small>LIFETIME DEPOSITED</small><strong>${money(b.deposited)}</strong></div><div class="stat"><small>ACTIVITY ENTRIES</small><strong>${b.all.length}</strong></div></div><form id="ratesForm"><div class="heading">INDIVIDUAL PRICES</div><div class="grid">${activityTypes.map(([k,label])=>field(label+' ($ per entry / occurrence)',k,String(f.rates[k]||0),'number')).join('')}</div><button class="btn alt">SAVE PRICES</button></form><div class="heading">PENDING ACTIVITY</div><div class="grid">${activityTypes.map(([k,label])=>item(label,`${b.pending.filter(x=>x.billType===k).length} entries · ${money(b.pending.filter(x=>x.billType===k).reduce((a,x)=>a+amountFor(x),0))}`)).join('')}</div><div class="actions"><button class="btn" data-deposit="1" ${b.pending.length===0?'disabled':''}>RECORD DEPOSIT — ${money(b.outstanding)}</button></div><p class="muted">Confirm only after actually making the deposit. A confirmation prompt will appear.</p></div>${section('FINANCIAL DEPOSIT LOG',f.deposits.length?f.deposits.slice().reverse().map(d=>`<div class="entry"><strong>${esc(d.date)} · ${money(d.amount)}</strong><p>Transaction: ${esc(d.id)} · ${d.entryIds.length} activity entries settled</p></div>`).join(''):'<p class="muted">No deposits recorded yet.</p>')}`}
function personalPage(){const p=find(detailId);if(!p)return '<p>Record not found.</p>';const tabs=[['details','Personal Details'],['communication','Communication'],['male','Male Activity'],['sexual','Sexual Activity'],['financial','Financial'],['advisor','AI Advisor'],['photos','Photos'],['documents','Documents'],['dates','Important Dates'],['notes','Personal Notes']];return `<div class="actions"><button class="btn alt" data-master="${encodeURIComponent(detailId)}">← BACK TO MASTER RECORD</button></div>${identity(p,true)}<div class="tabs">${tabs.map(([id,name])=>`<button class="tab ${personalTab===id?'active':''}" data-tab="${id}">${name}</button>`).join('')}</div>${personalTab==='details'?personalDetails():personalTab==='communication'?communication():personalTab==='male'?malePage():personalTab==='sexual'?sexualPage():personalTab==='financial'?financialPage():personalTab==='advisor'?advisor():personalTab==='notes'?`<div class="panel"><div class="heading">PERSONAL NOTES</div><form id="notesForm">${area('Personal Notes','personalNotes',file().details?.personalNotes||'')}<button class="btn">SAVE NOTES</button></form></div>`:personalTab==='dates'?section('IMPORTANT DATES',`<div class="grid">${item('Admission Date',p.admission)}${item('Projected Release',p.release)}${item('Other Important Dates',file().details?.dates)}</div>`):`<div class="panel"><div class="heading">${personalTab==='photos'?'PERSONAL PHOTOS':'PERSONAL DOCUMENTS'}</div><p class="muted">Reserved for a future update. No uploads are enabled yet.</p></div>`}`}
function render(){const names={dashboard:'Command Dashboard',profiles:'Inmate Profiles',register:'Inmate Registration',detail:'Inmate Master Record',personal:'Inmate Personal File',gallery:'Photo Gallery',facilities:'Facilities',records:'Records',search:'Search',reports:'Reports',settings:'Settings'};$('pageTitle').textContent=names[view]||'NEXUS';document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.view===view));let html='';if(view==='dashboard'){html=`<div class="grid"><div class="panel"><h3>Registered Profiles</h3><h1>${profiles.length}</h1></div><div class="panel"><h3>Active Records</h3><h1>${profiles.filter(p=>p.status!=='Inactive').length}</h1></div><div class="panel"><h3>Personal Files</h3><h1>${Object.keys(personal).filter(id=>find(id)).length}</h1></div></div><div class="actions"><button class="btn" data-view="register">+ New Registration</button><button class="btn alt" data-view="profiles">View Profiles</button></div>${profileCards(profiles.slice(0,8))}`;}else if(view==='profiles'||view==='gallery'||view==='search'){html=`<div class="actions"><button class="btn" data-view="register">+ New Registration</button></div><div class="panel"><div class="field"><label>Search by name, ID, state, or facility</label><input id="searchBox" placeholder="Search profiles..." value="${esc(filter)}"></div></div><div id="profileResults">${profileCards(profiles.filter(p=>[p.id,p.first,p.last,p.state,p.facility].join(' ').toLowerCase().includes(filter.toLowerCase())).sort((a,b)=>(a.last||'').localeCompare(b.last||'')))}</div>`;}else if(view==='register')html=registration();else if(view==='detail')html=detail();else if(view==='personal')html=personalPage();else if(view==='facilities'){const fs=[...new Set(profiles.map(p=>p.facility).filter(Boolean))];html=section('FACILITIES',fs.length?fs.map(f=>`<p>${esc(f)} — ${profiles.filter(p=>p.facility===f).length} records</p>`).join(''):'No facilities recorded.')}else if(view==='records')html=profileCards(profiles);else if(view==='reports')html=section('REPORTS',`<p>Total profiles: ${profiles.length}</p><p>Active: ${profiles.filter(p=>p.status!=='Inactive').length}</p>`);else if(view==='settings')html=section('DEMO SETTINGS',`<p class="notice">This public GitHub Pages demo has no real authentication or server security. Do not enter real inmate information, private correspondence, medical information, or other sensitive personal data.</p><p>Data is saved only in this browser.</p><button class="btn" id="backup">EXPORT BACKUP JSON</button>`);$('content').innerHTML=html}
function go(v){view=v;render();window.scrollTo(0,0)}
function captureRows(){document.querySelectorAll('[data-table]').forEach(i=>{const k=i.dataset.table,r=+i.dataset.row,c=+i.dataset.col;if(!tableRows[k])tableRows[k]=[];if(!tableRows[k][r])tableRows[k][r]=[];tableRows[k][r][c]=i.value})}
$('content').addEventListener('input',e=>{if(e.target.id==='searchBox'){filter=e.target.value;$('profileResults').innerHTML=profileCards(profiles.filter(p=>[p.id,p.first,p.last,p.state,p.facility].join(' ').toLowerCase().includes(filter.toLowerCase())).sort((a,b)=>(a.last||'').localeCompare(b.last||'')))} });
$('content').addEventListener('change',e=>{if(e.target.id==='photoInput'){const f=e.target.files[0];if(!f)return;if(!['image/jpeg','image/png','image/webp'].includes(f.type)){alert('Use JPEG, PNG or WebP.');return}if(f.size>1500000){alert('Choose a photo smaller than 1.5 MB to avoid browser storage limits.');return}const r=new FileReader();r.onload=()=>{photoData=String(r.result);const img=document.querySelector('#recordForm .photo');if(img){const el=document.createElement('img');el.className='photo';el.alt='Profile photograph';el.src=photoData;img.replaceWith(el)}};r.readAsDataURL(f)}});
$('content').addEventListener('submit',e=>{e.preventDefault();const form=e.target,fd=new FormData(form);if(form.id==='recordForm'){captureRows();const id=String(fd.get('id')||'').trim();if(!id){alert('Inmate ID is required.');return}if(profiles.some(p=>p.id===id&&p.id!==editId)){alert('This Inmate ID already exists.');return}const old=editId?find(editId):null;const p={...(old||{})};for(const [k,v] of fd.entries())if(k!=='photo')p[k]=String(v);p.id=id;p.photo=photoData||old?.photo||'';for(const t of tableDefs)p[t.key]=(tableRows[t.key]||old?.[t.key]||[]).filter(r=>Array.isArray(r)?r.some(x=>String(x||'').trim()):Object.values(r||{}).some(x=>String(x||'').trim()));if(old){const idx=profiles.indexOf(old);profiles[idx]=p;if(editId!==id&&personal[editId]){personal[id]=personal[editId];delete personal[editId];savePersonal()}}else profiles.push(p);if(saveProfiles()){detailId=id;editId=null;photoData='';tableRows={};go('detail')}}else if(form.id==='personalForm'||form.id==='notesForm'){const f=file();f.details={...(f.details||{})};for(const [k,v] of fd.entries())f.details[k]=String(v);f.updated=new Date().toISOString();if(savePersonal()){alert('Personal file saved.');render()}}else if(form.id==='entryForm'){const date=String(fd.get('date')||''),message=String(fd.get('message')||'').trim(),type=String(fd.get('type')||'');if(!date||!message){alert('Enter a date and message or summary.');return}if(date>today()){alert('Communication date cannot be in the future.');return}file().entries.push({uid:Date.now().toString(36)+Math.random().toString(36).slice(2),date,type,message,amount:Math.max(0,Number(financeFile().rates[type])||0)});analysisVisible=false;if(savePersonal())render()}else if(form.id==='ratesForm'){const f=financeFile();for(const [k] of activityTypes){const v=Number(fd.get(k));if(!Number.isFinite(v)||v<0){alert('Prices must be zero or greater.');return}f.rates[k]=Math.round(v*100)/100}savePersonal();render()}else if(form.id==='sexualForm'){const date=String(fd.get('date')||''),message=String(fd.get('message')||'').trim(),occurrences=Number(fd.get('occurrences'));if(!date||date>today()||!Number.isInteger(occurrences)||occurrences<1||occurrences>100||!message){alert('Enter a valid date, occurrence count, and context.');return}const f=financeFile();f.sexualEntries.push({uid:Date.now().toString(36)+Math.random().toString(36).slice(2),date,message,occurrences,amount:Math.round(occurrences*Math.max(0,Number(f.rates.Sexual)||0)*100)/100});savePersonal();render()}else if(form.id==='interestsForm'){const f=financeFile();f.details={...(f.details||{}),interests:String(fd.get('interests')||''),boundaries:String(fd.get('boundaries')||'')};savePersonal();render()}else if(form.id==='maleForm'){const f=financeFile();f.maleReports.push({date:String(fd.get('date')||''),category:String(fd.get('category')||''),evidence:String(fd.get('evidence')||''),interpretation:String(fd.get('interpretation')||'')});savePersonal();render()}});
$('content').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){if(b.dataset.view==='register'){editId=null;photoData='';tableRows={}}go(b.dataset.view);return}if(b.dataset.open){detailId=decodeURIComponent(b.dataset.open);go('detail');return}if(b.dataset.personal){detailId=decodeURIComponent(b.dataset.personal);personalTab='details';go('personal');return}if(b.dataset.master){go('detail');return}if(b.dataset.edit){editId=decodeURIComponent(b.dataset.edit);photoData='';tableRows={};go('register');return}if(b.dataset.delete){const id=decodeURIComponent(b.dataset.delete);if(confirm('Permanently delete this demo master record and its personal file from this browser?')){profiles=profiles.filter(p=>p.id!==id);delete personal[id];saveProfiles();savePersonal();go('profiles')}return}if(b.dataset.tab){personalTab=b.dataset.tab;render();return}if(b.dataset.window){windowDays=Number(b.dataset.window);analysisVisible=false;render();return}if(b.id==='analyze'){analysisVisible=true;render();return}if(b.dataset.deposit){const f=financeFile(),d=balanceData();if(!d.pending.length)return;if(!confirm('Confirm you have made a deposit of '+money(d.outstanding)+'? This records the deposit and clears the pending balance.'))return;f.deposits.push({id:'DEP-'+Date.now(),date:new Date().toLocaleString(),amount:Math.round(d.outstanding*100)/100,entryIds:d.pending.map(x=>x.uid)});savePersonal();render();return}if(b.dataset.sexDelete){const f=financeFile();if(f.deposits.some(d=>d.entryIds.includes(b.dataset.sexDelete))){alert('This activity is linked to a recorded deposit and cannot be deleted.');return}if(confirm('Delete this sexual activity entry?')){f.sexualEntries=f.sexualEntries.filter(x=>x.uid!==b.dataset.sexDelete);savePersonal();render()}return}if(b.dataset.entryDelete){if(financeFile().deposits.some(d=>d.entryIds.includes(b.dataset.entryDelete))){alert('This entry is linked to a recorded deposit and cannot be deleted.');return}if(confirm('Delete this communication entry?')){file().entries=file().entries.filter(x=>x.uid!==b.dataset.entryDelete);savePersonal();analysisVisible=false;render()}return}if(b.dataset.add){captureRows();const t=tableDefs.find(x=>x.key===b.dataset.add);tableRows[t.key]??=[];tableRows[t.key].push(t.cols.map(() => ''));render();return}if(b.dataset.remove){captureRows();tableRows[b.dataset.remove]?.splice(Number(b.dataset.index),1);render();return}if(b.id==='backup'){const data={masterRecords:profiles,personalFiles:personal,exportedAt:new Date().toISOString()};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='nexus-demo-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}});
document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.view==='register'){editId=null;photoData='';tableRows={}}go(b.dataset.view)}));
$('gateForm').addEventListener('submit',e=>{e.preventDefault();$('gateway').classList.add('hidden');$('login').classList.remove('hidden')});$('loginForm').addEventListener('submit',e=>{e.preventDefault();$('login').classList.add('hidden');$('shell').classList.remove('hidden');go('dashboard')});$('lock').addEventListener('click',()=>{$('shell').classList.add('hidden');$('gateway').classList.remove('hidden');$('gateForm').reset();$('loginForm').reset()});$('bell').addEventListener('click',()=>alert('NEXUS Notification Center: bell icon added. We will design its alert functions later.'));
})();
</script></body></html>
