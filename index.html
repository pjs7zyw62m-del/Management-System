/* Clear separation of financial sections, avoiding the global negative heading margins. */

.finance-panel{padding:18px;}

.finance-panel>.heading{margin:-18px -18px 18px;}

.finance-panel .stats{margin:18px 0 24px;gap:12px;}

.finance-panel #ratesForm{margin-top:18px;padding-top:8px;}

.finance-panel #ratesForm>.heading,.finance-panel>.heading:not(:first-child){margin:14px 0 16px;border-radius:6px;padding:12px 14px;}

.finance-panel #ratesForm>.grid{margin-bottom:14px;}

.finance-panel #ratesForm+.heading{margin-top:28px!important;}

.finance-panel #ratesForm+.heading+.grid{margin-top:14px;margin-bottom:16px;}

.finance-panel .actions{margin-top:16px;}

.sex-disclosure{background:#101d2d;border:1px solid #28415e;border-radius:10px;margin-bottom:16px;overflow:hidden;}

.sex-disclosure>summary::-webkit-details-marker{display:none;}

.sex-disclosure>summary::after{content:'▾';float:right;}

.sex-disclosure[open]>summary::after{content:'▴';}

.sex-disclosure .disclosure-body{padding:16px;}

.sex-disclosure .panel{margin:0;border:0;background:transparent;padding:0;}

.sex-disclosure .section-title{display:none;}

/* Communication history scrolls within a fixed-height panel. */
.communication-history-list{max-height:420px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;padding-right:6px}
.communication-history-panel{min-width:0}
.fcx .fcx-source{padding:9px 15px;background:#0e1622;border:1px solid #293a50;border-radius:8px;margin-top:8px;font-size:12px;color:#adc5e0}
.fcx .fcx-source a{color:#8fc4ff;text-decoration:underline}
@media(max-width:700px){.communication-history-list{max-height:320px}}
/* Profile header: badges below photograph; indicator beside facility information */
.nexus-profile-header{align-items:flex-start}
.nexus-photo-column{display:flex;flex-direction:column;align-items:center;gap:10px;flex:0 0 auto}
.nexus-photo-badges{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;max-width:185px}
.nexus-file-badge{background:#195fa9}
.nexus-identity-main{flex:1;min-width:0}
.nexus-identity-main h2{margin:0 0 6px}
.nexus-info-and-assessment{display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap}
.nexus-identity-facts{flex:1 1 280px;gap:14px}
.nexus-side-assessment{flex:1 1 270px;margin-top:0;max-width:480px;min-width:0}
.nexus-side-assessment .five-level{gap:5px}
.nexus-side-assessment .five-segment{padding:10px 3px}
@media(max-width:700px){.nexus-photo-badges{max-width:140px}.nexus-info-and-assessment{flex-direction:column}.nexus-side-assessment{width:100%;max-width:none}}


/* Compact Personal File header: four details in one row, indicator 12% smaller. */
.nexus-personal-facts{display:grid;grid-template-columns:minmax(75px,.85fr) minmax(55px,.55fr) minmax(95px,1fr) minmax(170px,2.1fr);gap:8px 10px;flex:1 1 490px;min-width:0;align-items:start}
.nexus-personal-facts .fact{min-width:0;padding-right:9px;overflow-wrap:anywhere}
.nexus-personal-facts .nexus-facility-fact{border-right:0}
.nexus-side-assessment{flex:0 1 345px;max-width:345px;padding:10px;font-size:.88em;line-height:1.35}
.nexus-side-assessment .muted{font-size:11px}
.nexus-side-assessment .five-level{gap:4px}
.nexus-side-assessment .five-segment{padding:8px 2px}
.nexus-side-assessment p{margin:8px 0;font-size:12px}
@media(max-width:850px){.nexus-personal-facts{flex-basis:100%}.nexus-side-assessment{flex-basis:345px;max-width:100%}}
@media(max-width:550px){.nexus-personal-facts{grid-template-columns:repeat(2,minmax(0,1fr))}.nexus-personal-facts .fact:nth-child(2){border-right:0}}


/* NEXUS compact indicator under profile ID; overlay does not push page down. */
.nexus-revised-facts{display:flex;align-items:start;flex-wrap:wrap;gap:10px 16px}
.nexus-revised-facts .fact{min-width:70px;max-width:300px}
.nexus-revised-facts .nexus-facility-fact{border-right:0}
.nexus-assessment-line{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:11px;position:relative;isolation:isolate}
.nexus-assessment-mini{width:min(265px,100%);flex:0 1 265px}
.nexus-assessment-label{color:#acc7e8;font-size:10px;font-weight:800;letter-spacing:.2px;margin-bottom:6px}
.nexus-indicator-bands{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.nexus-indicator-bands .five-segment{font-size:12px;padding:7px 2px;text-align:center;border-radius:5px}
.nexus-cue-dropdown{position:relative;flex:0 0 auto;z-index:15}
.nexus-cue-dropdown>summary{list-style:none;cursor:pointer;padding:9px 12px;border:1px solid #456590;background:#182c47;color:#e7f2ff;border-radius:7px;font-weight:800;font-size:11px}
.nexus-cue-dropdown>summary::-webkit-details-marker{display:none}
.nexus-cue-dropdown[open]>summary{background:#245b9c}
.nexus-cue-popup{position:absolute;z-index:100;top:calc(100% + 6px);left:0;width:min(360px,calc(100vw - 55px));max-height:min(70vh,500px);overflow-y:auto;background:#0d1829;border:1px solid #5a7395;border-radius:11px;box-shadow:0 20px 50px #000b;padding:15px}

.nexus-cue-score{display:flex;justify-content:space-between;gap:8px;margin-bottom:12px;font-size:12px;color:#b1c7df}
.nexus-cue-score strong{font-size:17px;color:#fff}
.nexus-cue-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #263a50;font-size:12px}
.nexus-cue-row strong{font-variant-numeric:tabular-nums;white-space:nowrap}
.nexus-cue-total{font-weight:800;color:#fff}
.nexus-cue-popup .muted{line-height:1.5;font-size:11px;margin:12px 0 0}

/* Comprehensive communication review: floating, internal scrolling, no layout shift */

.nexus-profile-metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:30px;align-items:stretch;width:100%;max-width:850px}

.nexus-metric-footer{margin-top:15px;display:flex;justify-content:flex-start}

.nexus-sexual-count{display:flex;gap:12px;align-items:center;margin:8px 0 17px}
.nexus-sexual-count strong{font-size:34px;font-variant-numeric:tabular-nums;color:#f0f6ff}

let selectedPhotoFile=null;async function uploadNexusPhoto(file, inmateId) {
  const { data: { user }, error: authError } =
    await nexusDB.auth.getUser();

  if (authError || !user) {
    throw new Error('Please sign in before uploading a photo.');
  }

  if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
    throw new Error('Only JPEG, PNG, and WebP photos are allowed.');
  }

  if (file.size > 1500000) {
    throw new Error('Photo must be smaller than 1.5 MB.');
  }

  const extension = {
    'image/jpeg': 'jpg',
    'image/png': 'png',
    'image/webp': 'webp'
  }[file.type];

  const path = user.id + '/' + crypto.randomUUID() + '.' + extension;

  const { data, error } = await nexusDB.storage
    .from(NEXUS_PHOTO_BUCKET)
    .upload(path, file, {
      contentType: file.type,
      upsert: false
    });

  if (error) {
    throw new Error('Photo upload failed: ' + error.message);
  }

  return data.path;
}

            async function saveMasterToSupabase(p){
  const {data:{user},error} = await nexusDB.auth.getUser();

  if(error || !user){
    throw new Error('Please sign in to save a Master Record.');
  }
  let uploadedPhotoPath = null;

  if (selectedPhotoFile) {
    uploadedPhotoPath = await uploadNexusPhoto(
      selectedPhotoFile,
      p.id
    );
  }
    const record = {
    owner_id: user.id,
    inmate_id: p.id,
    photo_path: uploadedPhotoPath || p.photo_path || null,
    first_name: p.first || null,
    middle_name: p.middle || null,
    last_name: p.last || null,
    age: p.age === '' ? null : Number(p.age) || null,
    state: p.state || null,
    facility: p.facility || null,
    housing_unit: p.unit || null,
    sentence_type: p.sentenceType || 'Unknown',
    parole_eligibility_date: p.paroleEligibility || null,
    status: p.status || 'Active',
    admission_date: p.admission || null,
    earliest_release_date: p.earliestRelease || null,
    projected_release_date: p.release || null,
    custody_classification: p.custody || null,
    most_recent_location: p.location || null,
    mailing_address: p.mailing || null,
    gender: p.gender || null,
    height_inches: p.heightInches === '' ? null : Number(p.heightInches),
    weight: p.weight === '' ? null : Number(p.weight),
    hair_color: p.hairColor || null,
    eye_color: p.eyeColor || null,
    ethnic_origin: p.ethnicOrigin || null,
    prison_release_text: p.prisonReleaseText || null,
    release_type_text: p.releaseTypeText || null,
    location_as_of: p.locationAsOf || null,
    last_movement: p.lastMovement || null,
    notes: p.notes || null
  };

  const {data, error: saveError} = await nexusDB
    .from('nexus_profiles')
    .upsert(record, {onConflict: 'owner_id,inmate_id'})
    .select()
    .single();

  if(saveError){
    throw new Error('Supabase save failed: ' + saveError.message);
  }
  const sectionRows = [];

  for (const section of tableDefs) {
    const rows = p[section.key] || [];

    rows.forEach((row, index) => {
      sectionRows.push({
        owner_id: user.id,
        profile_id: data.id,
        section_type: section.key,
        row_position: index,
        row_data: { cells: row }
      });
    });
  }

  const { error: sectionError } = await nexusDB
    .rpc('nexus_replace_master_sections', {
      p_profile_id: data.id,
      p_rows: sectionRows
    });

  if (sectionError) {
    throw new Error(
      'Could not save Master Record sections: ' + sectionError.message
    );
  }
  const previousPhotoPath=p.previous_photo_path;
  p.photo_path = data.photo_path;
  delete p.previous_photo_path;
  if(p.photo_path){
    try{p.photo=await signedPhotoUrl(p.photo_path)}catch(err){console.warn(err.message);p.photo=''}
  }
  if(uploadedPhotoPath && previousPhotoPath && previousPhotoPath!==uploadedPhotoPath){
    const {error:cleanupError}=await nexusDB.storage.from(NEXUS_PHOTO_BUCKET).remove([previousPhotoPath]);
    if(cleanupError)console.warn('Old photo cleanup failed:',cleanupError.message);
  }
  return data;
}

function nexusSexualLanguageScore(){
 const f=file(),ignored=f.sexualCueIgnored||{};

 for(const entry of f.entries||[]){
  if(!String(entry.message||'').trim())continue;
  rules.forEach((rule,i)=>{
   const found=[...new Set(nexusPhraseCount(String(entry.message),rule.terms))].slice(0,8);

    totals[i]+=rule.points;
    results.push({key,phrase,label:rule.label,points:rule.points,date:entry.date,type:entry.type});
   }
  });
 }
 return {total:totals.reduce((a,b)=>a+b,0),rules,totals,results,entries:(f.entries||[]).length};
}

function stats(){
 const entries=file().entries;
 const now=Date.now(),ms=86400000;
 const valid=entries.filter(e=>{const t=new Date(String(e.date||'')+'T12:00:00').getTime();return Number.isFinite(t)&&t<=now;});
 const inWindow=(days,offset=0)=>valid.filter(e=>{const t=new Date(e.date+'T12:00:00').getTime();return t<=now-offset*ms&&t>now-(days+offset)*ms;});
 const allTime=windowDays===0;
 const recent=allTime?entries.slice():inWindow(windowDays);
 const previous=allTime?[]:inWindow(windowDays,windowDays);
 const earliest=valid.length?Math.min(...valid.map(e=>new Date(e.date+'T12:00:00').getTime())):now;
 const elapsedDays=Math.max(1,Math.ceil((now-earliest)/ms)+1);
 const rate=recent.length*30/(allTime?elapsedDays:windowDays);
 const prevRate=allTime?0:previous.length*30/windowDays;
 const level=rate<5?'LOW':rate<15?'MEDIUM':'HIGH',cls=level.toLowerCase();
 const change=allTime?null:(prevRate?Math.round((rate-prevRate)/prevRate*100):null);
 const last=valid.map(e=>new Date(e.date+'T12:00:00').getTime()).sort((a,b)=>b-a)[0];
 return {recent,previous,level,cls,change,rate,days:last?Math.floor((now-last)/ms):null,allTime,elapsedDays,counts:{Text:recent.filter(e=>e.type==='Text').length,Email:recent.filter(e=>e.type==='Email').length,Call:recent.filter(e=>e.type==='Call').length}};
}

function nexusChronologicalEntries(){
  // Dates may be identical. Within the same date, newest saved entry wins.
  return file().entries.map((entry,index)=>({entry,index}))
    .sort((a,b)=>{
      const dateOrder=String(b.entry.date||'').localeCompare(String(a.entry.date||''));
      return dateOrder || b.index-a.index;
    }).map(x=>x.entry);
}

function nexusCsvRows(raw){
 const rows=[];let row=[],v='',quoted=false;
 for(let i=0;i<raw.length;i++){const ch=raw[i];if(ch==='"'){if(quoted&&raw[i+1]==='"'){v+='"';i++}else quoted=!quoted}else if(ch===','&&!quoted){row.push(v);v=''}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&raw[i+1]==='\n')i++;row.push(v);if(row.some(x=>x.trim()))rows.push(row);row=[];v=''}else v+=ch;}
 row.push(v);if(row.some(x=>x.trim()))rows.push(row);return rows;
}
async function nexusPrepareMessageFiles(){
 const input=$('nexusImportFiles'),files=Array.from(input?.files||[]),result=[],source=$('nexusImportSource')?.value||'Other',direction=$('nexusImportDirection')?.value||'Incoming',date=$('nexusImportDate')?.value||today();
 if(files.length>30){alert('Select up to 30 files per batch.');return;}
 for(const f of files){if(f.size>2_000_000){alert('File too large: '+f.name);return;}
 const ext=f.name.split('.').pop().toLowerCase();
 if(ext==='txt'){const message=(await f.text()).trim();if(message)result.push({date,type:'Email',direction,source,message});}
 else if(ext==='csv'){const rows=nexusCsvRows(await f.text());if(!rows.length)continue;const head=rows.shift().map(v=>v.trim().toLowerCase());const idx=k=>head.indexOf(k);if(idx('message')<0){alert('CSV must contain a message column.');return;}
 for(const r of rows){const message=(r[idx('message')]||'').trim();if(!message)continue;result.push({date:r[idx('date')]||date,type:r[idx('type')]||'Email',direction:r[idx('direction')]||direction,source:r[idx('source')]||source,message});}}
 else if(['png','jpg','jpeg','webp'].includes(ext)){result.push({imageOnly:true,name:f.name});}

function nexusNormalize(str){
 return String(str||'').normalize('NFKC').toLowerCase()
   .replace(/[’‘]/g,"'")
   .replace(/[\u200b-\u200d\ufeff]/g,'')
   .replace(/[@]/g,'a').replace(/0/g,'o').replace(/3/g,'e')
   .replace(/[$]/g,'s').replace(/[!1]/g,'i')
   .replace(/([a-z])\1{3,}/g,'$1$1')
   .replace(/[^a-z0-9'*\s]+/g,' ')
   .replace(/\s+/g,' ').trim();
}

}

 const custom=nexusCustomTerms().map(x=>({key:'custom'+x.id,label:x.category||'Custom phrases',points:x.points,terms:[x.term],custom:true}));

function nexusPhraseCount(text,terms){

  const phrase=nexusNormalize(term);
  if(!phrase)continue;

  const re=new RegExp('(?:^|[^a-z0-9])('+escaped+')(?![a-z0-9])','gi');

function nexusCueScore(){

  rules.forEach((rule,i)=>{
   const matches=[];
   for(const re of rule.regex||[]){
    const found=txt.match(re)||[];
    matches.push(...found.slice(0,3));
   }
   if(rule.terms)matches.push(...nexusPhraseCount(txt,rule.terms));
   const seen=[...new Set(matches.map(x=>String(x).toLowerCase()))].slice(0,2);
   for(const phrase of seen){
    const key=String(entry.uid||entry.date)+':'+rule.key+':'+phrase;
    if(ignored[key])continue;
    hits.push({key,rule:rule.label,phrase,points:rule.points,date:entry.date,type:entry.type,uid:entry.uid});
    counts[i]++;
    scores[i]+=rule.points;
   }
  });

function financeFile(){const f=file();if(!f.rates)f.rates={Text:0,Email:0,Call:0,Sexual:0};if(!Array.isArray(f.sexualEntries))f.sexualEntries=[];if(!Array.isArray(f.deposits))f.deposits=[];if(!Array.isArray(f.maleReports))f.maleReports=[];return f}

function balanceFor(id){const f=personal[id]||{},rates=f.rates||{},entries=Array.isArray(f.entries)?f.entries:[],sexual=Array.isArray(f.sexualEntries)?f.sexualEntries:[],deposits=Array.isArray(f.deposits)?f.deposits:[];const all=[...entries.map(x=>({...x,billType:x.type})),...sexual.map(x=>({...x,billType:'Sexual'}))];const settled=new Set(deposits.flatMap(d=>d.entryIds||[]));const pending=all.filter(x=>!settled.has(x.uid));const subtotal=t=>pending.filter(x=>x.billType===t).reduce((sum,x)=>sum+amountFor(x,f),0);const outstanding=pending.reduce((sum,x)=>sum+amountFor(x,f),0);return {all,pending,subtotal,outstanding:Math.round(outstanding*100)/100,deposited:deposits.reduce((a,d)=>a+Number(d.amount||0),0),deposits,rates}}

const NX_BUDGET_KEY='nexus_budget_ledger_v1';
function nxBudget(){const a=read(NX_BUDGET_KEY,{activeAt:null,items:[],requests:[]});return {activeAt:a.activeAt||null,items:Array.isArray(a.items)?a.items:[],requests:Array.isArray(a.requests)?a.requests:[]}}
function nxCash(v){return '$'+(Math.round(v)/100).toFixed(2)}
function nxAmount(raw){const s=String(raw||'').trim();if(!/^\d+(\.\d{1,2})?$/.test(s))return null;const cents=Math.round(Number(s)*100);return Number.isSafeInteger(cents)&&cents>0&&cents<=100000000?cents:null}
function nxDate(){return new Date().toLocaleDateString('en-CA',{timeZone:'America/Los_Angeles',year:'numeric',month:'2-digit',day:'2-digit'})}
function nxCycle(d){const parts=String(d).slice(0,10).split('-').map(Number);if(parts.length!==3||parts.some(x=>!Number.isFinite(x)))return 'Unknown';const [y,m,day]=parts;const st=new Date(Date.UTC(y,m-(day<6?2:1),6));const en=new Date(Date.UTC(st.getUTCFullYear(),st.getUTCMonth()+1,5));return st.toISOString().slice(0,10)+' / '+en.toISOString().slice(0,10)}
function nxTotals(a=nxBudget()){const incoming=a.items.filter(x=>x.kind==='fund').reduce((s,x)=>s+x.cents,0),outgoing=a.items.filter(x=>x.kind!=='fund').reduce((s,x)=>s+x.cents,0);const owed=a.requests.filter(x=>x.status==='owed').reduce((s,x)=>s+Math.max(0,x.cents-x.paid),0);return {incoming,outgoing,available:incoming-outgoing,owed};}
function nxFinancialOverview(){const a=nxBudget(),t=nxTotals(a),current=nxCycle(nxDate());const groups=[...new Set([current,...a.items.map(x=>nxCycle(x.date))])].sort().reverse();return `<div class="panel"><div class="heading">NEXUS PRIVATE BUDGET LEDGER · 6TH–5TH MONTHLY CYCLE</div><p class="muted">A personal budget tracker, not a bank account. All amounts are manually entered. Inmate transfers must be confirmed in the inmate Financial tab.</p>${!a.activeAt?`<div class="notice"><strong>Ledger not activated.</strong> Activating starts a permanent record of your budget transactions. <button class="btn" id="nxActivate">ACTIVATE FINANCIAL LEDGER</button></div>`:`<p class="notice">Activated ${esc(a.activeAt)} · Current statement period: <strong>${esc(current)}</strong></p>`}<div class="stats"><div class="stat"><small>AVAILABLE FUNDS</small><strong>${nxCash(t.available)}</strong></div><div class="stat"><small>PROMISED / OWED</small><strong>${nxCash(t.owed)}</strong></div><div class="stat"><small>AVAILABLE AFTER PROMISES</small><strong>${nxCash(t.available-t.owed)}</strong></div></div>${t.available<t.owed?`<div class="notice">FUNDING SHORTFALL: ${nxCash(t.owed-t.available)}</div>`:''}<div class="cols"><div><form id="nxBudgetForm"><div class="heading">ADD FUNDS OR EXPENSE</div><div class="field"><label>Transaction type</label><select name="kind"><option value="fund">Add budget funds</option><option value="expense">Subtract purchased email / text / other expense</option></select></div><div class="field"><label>Amount ($)</label><input type="number" name="amount" step="0.01" min="0.01" required></div><div class="field"><label>Date</label><input type="date" name="date" value="${nxDate()}" required></div><div class="field"><label>Category</label><select name="category"><option>Email Credits</option><option>Text Messages</option><option>Stamps</option><option>Phone Calls</option><option>Video Visits</option><option>Other</option></select></div><div class="field"><label>Memo</label><input name="memo" maxlength="240" placeholder="Receipt or reason"></div><button class="btn" ${!a.activeAt?'disabled':''}>SAVE BUDGET TRANSACTION</button></form></div><div><div class="heading">CURRENT & PRIOR STATEMENT PERIODS</div>${groups.slice(0,18).map(g=>{const items=a.items.filter(x=>nxCycle(x.date)===g),net=items.reduce((sum,x)=>sum+(x.kind==='fund'?x.cents:-x.cents),0),before=a.items.filter(x=>nxCycle(x.date)<g).reduce((sum,x)=>sum+(x.kind==='fund'?x.cents:-x.cents),0);return `<div class="entry"><strong>${esc(g)} ${g===current?'· CURRENT':'· CLOSED PERIOD'}</strong><p>Opening ${nxCash(before)} · ${items.length} transactions · Net ${nxCash(net)} · Closing ${nxCash(before+net)}</p></div>`}).join('')}</div></div>${section('BUDGET TRANSACTION HISTORY',a.items.slice().reverse().slice(0,50).map(x=>`<div class="entry"><strong>${esc(x.date)} · ${esc(x.kind==='fund'?'FUNDS ADDED':x.kind==='expense'?'EXPENSE':'INMATE DEPOSIT')} · ${x.kind==='fund'?'+':'−'}${nxCash(x.cents)}</strong><p>${esc(x.category||'')} ${x.inmateId?'· Inmate '+esc(x.inmateId):''} · ${esc(x.memo||'')}</p></div>`).join('')||'<p class="muted">No financial transactions recorded yet.</p>')}</div>`}
function nxInmateFinance(){const a=nxBudget(),t=nxTotals(a),id=detailId,req=a.requests.filter(r=>r.inmateId===id),deposits=a.items.filter(x=>x.kind==='deposit'&&x.inmateId===id),total=deposits.reduce((s,x)=>s+x.cents,0),owed=req.filter(x=>x.status==='owed').reduce((s,x)=>s+x.cents-x.paid,0);return `<div class="panel"><div class="heading">INMATE REQUESTS & VERIFIED DEPOSITS · BUDGET LINKED</div><div class="stats"><div class="stat"><small>LIFETIME GIVEN IN NEW LEDGER</small><strong>${nxCash(total)}</strong></div><div class="stat"><small>PROMISED / OWED</small><strong>${nxCash(owed)}</strong></div><div class="stat"><small>AVAILABLE CENTRAL BUDGET</small><strong>${nxCash(t.available)}</strong></div></div><p class="muted">This new ledger starts separately from historical communication-rate deposit records below. Existing historical deposits are not deducted retroactively from the budget. Do not enter them again.</p><div class="cols"><form id="nxRequestForm"><div class="heading">RECORD MONEY REQUEST</div><div class="field"><label>Amount ($)</label><input type="number" name="amount" min="0.01" step="0.01" required></div><div class="field"><label>Due date</label><input type="date" name="due" value="${nxDate()}"></div><div class="field"><label>Status</label><select name="status"><option value="requested">Requested only — not promised</option><option value="owed">Promised / owed</option><option value="declined">Declined</option></select></div><div class="field"><label>Notes</label><input name="memo" maxlength="240"></div><button class="btn">SAVE REQUEST</button></form><form id="nxDepositForm"><div class="heading">RECORD CONFIRMED DEPOSIT</div><div class="field"><label>Amount ($)</label><input type="number" name="amount" min="0.01" step="0.01" required></div><div class="field"><label>Date</label><input type="date" name="date" value="${nxDate()}" required></div><div class="field"><label>Apply to</label><select name="requestId"><option value="">Additional deposit (not toward a request)</option>${req.filter(r=>r.status==='owed'&&r.cents>r.paid).map(r=>`<option value="${esc(r.id)}">${nxCash(r.cents-r.paid)} owed · ${esc(r.due||'No due date')} · ${esc(r.memo||'')}</option>`).join('')}</select></div><div class="field"><label>Notes / receipt</label><input name="memo" maxlength="240"></div><button class="btn" ${!a.activeAt?'disabled':''}>CONFIRM ALREADY-SENT DEPOSIT</button><p class="muted">This does not send money. Activate the central budget first; the payment will deduct funds once and adjust any linked request.</p></form></div>${section('REQUEST & DEPOSIT HISTORY',req.map(r=>`<div class="entry"><strong>${esc(r.status.toUpperCase())} · ${nxCash(r.cents-r.paid)} remaining</strong><p>Due ${esc(r.due||'unspecified')} · ${esc(r.memo||'')}</p>${r.status==='requested'?`<button class="btn alt small" data-nx-promise="${esc(r.id)}">MARK PROMISED / OWED</button>`:''}</div>`).join('')+deposits.map(d=>`<div class="entry"><strong>PAID ${nxCash(d.cents)} · ${esc(d.date)}</strong><p>${esc(d.memo||'')}</p></div>`).join('')||'<p class="muted">No new requests or deposits yet.</p>')}</div>`}
function nxProcessFinancialForm(form){const fd=new FormData(form),a=nxBudget(),cents=nxAmount(fd.get('amount'));if(cents===null){alert('Enter a valid amount greater than zero.');return;}if(!a.activeAt){alert('Activate the budget ledger in Financial Center first.');return;}const now=new Date().toISOString(),id=crypto.randomUUID();if(form.id==='nxBudgetForm'){const kind=String(fd.get('kind'));if(kind==='expense'&&cents>nxTotals(a).available){alert('Not enough available funds.');return;}a.items.push({id,kind,cents,date:String(fd.get('date')),category:String(fd.get('category')),memo:String(fd.get('memo')),at:now});}else if(form.id==='nxRequestForm'){a.requests.push({id,inmateId:detailId,cents,paid:0,status:String(fd.get('status')),due:String(fd.get('due')),memo:String(fd.get('memo')),at:now});}else if(form.id==='nxDepositForm'){if(cents>nxTotals(a).available){alert('Not enough funds in central budget.');return;}const requestId=String(fd.get('requestId')),req=requestId?a.requests.find(r=>r.id===requestId&&r.inmateId===detailId&&r.status==='owed'):null;if(requestId&&(!req||cents>req.cents-req.paid)){alert('Amount exceeds linked outstanding request.');return;}if(req){req.paid+=cents;if(req.paid===req.cents)req.status='paid';}a.items.push({id,kind:'deposit',cents,date:String(fd.get('date')),inmateId:detailId,requestId:requestId||null,category:'Inmate deposit',memo:String(fd.get('memo')),at:now});}if(store(NX_BUDGET_KEY,a))render();}

/* Facilities read the same authenticated profile collection as the rest of NEXUS.
   Exterior photos are optional and saved on this browser only until a secure
   Supabase facility-image table/bucket is set up. */
let facState='',facPrison='',facFacility='',facQuery='';
const FAC_PHOTO_KEY='nexus_facility_photos_local_v1';
function facEntries(){
  const map=new Map();
  profiles.forEach(p=>{
    const state=String(p.state||'Unspecified state').trim();
    const facility=String(p.facility||'Unassigned facility').trim();
    const prison=facility; // Existing records store facility but not a separate prison field.
    const key=JSON.stringify([state,prison,facility]);
    if(!map.has(key))map.set(key,{state,prison,facility,people:[]});
    map.get(key).people.push(p);
  });
  return [...map.values()].sort((a,b)=>(a.state+a.facility).localeCompare(b.state+b.facility));
}
function facKey(e){return JSON.stringify([e.state,e.prison,e.facility])}
function facChoice(entries){
  let selected=entries.find(e=>e.state===facState&&e.prison===facPrison&&e.facility===facFacility);
  if(!selected){selected=entries[0]||null;if(selected){facState=selected.state;facPrison=selected.prison;facFacility=selected.facility}}
  return selected;
}
function facOptions(values,current){return values.map(v=>`<option value="${esc(v)}" ${v===current?'selected':''}>${esc(v)}</option>`).join('')}
// Wikimedia Commons images are public, and may not exist for every institution.
// Manual exterior photos always take precedence over automatic results.
const FAC_AUTO_CACHE=new Map();
function facNameTokens(s){
 return String(s||'').toLowerCase().normalize('NFKD').replace(/[^a-z0-9 ]/g,' ').split(/\s+/)
  .filter(t=>t.length>2&&!['the','and','state','prison','correctional','facility','complex','center','institution','federal','unit','rehabilitation'].includes(t));
}
async function facFindPublicPhoto(e){
 const k=facKey(e);
 if(FAC_AUTO_CACHE.has(k))return FAC_AUTO_CACHE.get(k);
 const query='"'+e.facility+'"';
 const params=new URLSearchParams({action:'query',format:'json',origin:'*',generator:'search',gsrsearch:query,gsrnamespace:'6',gsrlimit:'15',prop:'imageinfo',iiprop:'url|mime',iiurlwidth:'1200'});
 try{
  const response=await fetch('https://commons.wikimedia.org/w/api.php?'+params.toString(),{mode:'cors',credentials:'omit'});
  if(!response.ok)throw new Error('Image service unavailable');
  const data=await response.json();
  const pages=Object.values(data.query?.pages||{});
  const signature=facNameTokens(e.facility);
  const matches=pages.map(page=>{
   const info=page.imageinfo?.[0];
   if(!info||!/^image\/(jpeg|png|webp)$/.test(info.mime||''))return null;
   const title=String(page.title||'').replace(/^File:/i,'');
   const tokens=facNameTokens(title);
   const hits=signature.filter(t=>tokens.includes(t)).length;
   // No guessing from generic 'prison' or state names alone.
   const required=Math.max(1,Math.ceil(signature.length*0.8));
   if(!signature.length||hits<required)return null;
   return {url:info.thumburl||info.url,source:info.descriptionurl,score:hits,title};
  }).filter(Boolean).sort((a,b)=>b.score-a.score);
  const result=matches[0]||null;
  FAC_AUTO_CACHE.set(k,result);
  return result;
 }catch(err){console.warn('Public facility photo lookup failed:',err);return null;}
}
async function facUpdateAutomaticPhoto(e){
 const k=facKey(e);
 const hero=$('facAutoHero');
 if(!hero||hero.dataset.key!==k)return;
 const found=await facFindPublicPhoto(e);
 const current=$('facAutoHero');
 if(!current||current.dataset.key!==k||view!=='facilities')return;
 if(read(FAC_PHOTO_KEY,{})[k])return; // Never overwrite a manual photo.
 const status=$('facAutoStatus');
 if(!found){if(status)status.textContent='No confidently matched public photo found. You may upload your own.';return;}
 const img=document.createElement('img');
 img.className='fcx-photo';img.alt='Public image potentially showing '+e.facility;
 img.referrerPolicy='no-referrer';img.loading='lazy';img.src=found.url;
 img.onerror=()=>{img.remove();if(status)status.textContent='Public image could not be loaded. Upload your own photo.';};
 const art=current.querySelector('.fcx-art');if(art)art.remove();
 current.prepend(img);
 if(status){status.textContent='Public photo suggestion: verify the institution before relying on this image. Source: ';
   if(found.source){const link=document.createElement('a');link.href=found.source;link.target='_blank';link.rel='noopener noreferrer';link.textContent='Wikimedia Commons file and license';status.append(link);}}
}

 const maxType=Math.max(1,...typeCounts.map(x=>x.n));

 // Rank existing records using their saved text, email and call entries only.

   return {p,texts,emails,calls,total:texts+emails+calls};
 }).sort((a,b)=>b.total-a.total||displayName(a.p).localeCompare(displayName(b.p)));
 const highestCommunication=Math.max(1,...communicationRanking.map(r=>r.total));
 return `<div class="nxcc">

 <div class="nxcc-two">

 </div>
 <section class="nxcc-box"><h3>Most Communicated Inmates</h3><p class="nxcc-subtitle">Ranked from most to least saved communications · All Time · includes texts, emails and calls. A count is not a recommendation about a person.</p>

function nxParseCSV(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++;}else quoted=!quoted;}else if(c===','&&!quoted){row.push(cell);cell='';}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c;}row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows}

function nxTextGuess(text,source){const extract=pattern=>(String(text||'').match(pattern)||[])[1]?.trim()||'';const inmate=extract(/(?:DOC\s*(?:number|#|no\.?|id)?|inmate\s*(?:number|#|id)|ADC\s*(?:number|#))\s*[:#-]?\s*([A-Z0-9-]{3,24})/im);const first=extract(/(?:first\s*name)\s*[:=-]\s*([^\r\n]+)/im);const last=extract(/(?:last\s*name)\s*[:=-]\s*([^\r\n]+)/im);const state=extract(/(?:state)\s*[:=-]\s*([^\r\n]+)/im);const facility=extract(/(?:facility|institution)\s*[:=-]\s*([^\r\n]+)/im);return {source,id:inmate,first,last,state,facility,notes:String(text||'').slice(0,1000),review:true}}
async function nxBulkExtract(f,ocr){const ext=f.name.toLowerCase().split('.').pop();if(ext==='csv'){return nxBulkRows(nxParseCSV(await f.text()),f.name)}if(ext==='txt'){return [nxTextGuess(await f.text(),f.name)]}if(ext==='xlsx'){await nxLoadLibrary('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js','XLSX');const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});return wb.SheetNames.flatMap(name=>nxBulkRows(XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:false}),f.name+' / '+name))}if(ext==='docx'){await nxLoadLibrary('https://cdn.jsdelivr.net/npm/mammoth@1.9.1/mammoth.browser.min.js','DOCX');const result=await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()});return [nxTextGuess(result.value,f.name)]}if(ext==='pdf'){await nxLoadLibrary('https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js','PDF');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';const doc=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;let text='';for(let i=1;i<=Math.min(doc.numPages,30);i++){const page=await doc.getPage(i);text+='\n'+(await page.getTextContent()).items.map(x=>x.str).join(' ')}return [nxTextGuess(text,f.name)]}if(['png','jpg','jpeg','webp'].includes(ext)){if(!ocr)return [{...nxTextGuess('',f.name),notes:'Image queued for manual transcription; enable OCR to attempt text extraction.'}];await nxLoadLibrary('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js','OCR');const result=await Tesseract.recognize(f,'eng');return [nxTextGuess(result.data.text,f.name)]}throw Error('Unsupported file: '+f.name)}
function nxBulkStatus(r,i){const key=String(r.state||'').trim().toLowerCase()+'|'+String(r.id||'').trim().toLowerCase();if(!r.id||!r.first||!r.last||!r.state||!r.facility)return 'MISSING REQUIRED DETAILS';if(profiles.some(p=>String(p.id||'').trim().toLowerCase()===String(r.id).trim().toLowerCase()))return 'ALREADY EXISTS';if(nxBulkDrafts.some((o,j)=>j<i&&String(o.state||'').trim().toLowerCase()+'|'+String(o.id||'').trim().toLowerCase()===key))return 'DUPLICATE IN BATCH';return r.review?'REVIEW EXTRACTION':'READY'}

async function nxBulkPreview(){const files=Array.from($('nxBulkFiles')?.files||[]);if(!files.length){alert('Select files first.');return}if(files.length>20){alert('Choose 20 or fewer files per batch.');return}const ocr=Boolean($('nxBulkOCR')?.checked);const status=$('nxBulkResults');status.textContent='Extracting files. Verify everything before approval…';nxBulkDrafts=[];const errors=[];for(const f of files){try{if(f.size>5_000_000)throw Error('Maximum 5 MB per file');const rows=await nxBulkExtract(f,ocr);for(const r of rows){nxBulkDrafts.push({...r,approved:false});if(nxBulkDrafts.length>500)throw Error('Limit 500 draft profiles per batch')}}catch(e){errors.push(f.name+': '+e.message)}}nxBulkRender();if(errors.length)status.insertAdjacentHTML('afterbegin',`<div class="notice">${errors.map(esc).join(' | ')}</div>`)}
async function nxBulkCreate(){const approved=nxBulkDrafts.map((r,i)=>({r,i})).filter(x=>x.r.approved);if(!approved.length){alert('Select profiles to approve.');return}const bad=approved.filter(({r,i})=>nxBulkStatus(r,i)!=='READY'&&nxBulkStatus(r,i)!=='REVIEW EXTRACTION');if(bad.length){alert('Resolve incomplete or duplicate records, then click RECHECK.');return}if(!confirm('Create '+approved.length+' approved profiles in Supabase? These are actual cloud records.'))return;const button=$('nxBulkCreate');button.disabled=true;let count=0;const failures=[];try{for(const {r,i} of approved){try{if(profiles.some(p=>String(p.id).trim().toLowerCase()===String(r.id).trim().toLowerCase()))throw Error('Profile already exists');const p={id:r.id,first:r.first,last:r.last,state:r.state,facility:r.facility,status:'Active',notes:'Bulk import source: '+r.source};for(const t of tableDefs)p[t.key]=[];selectedPhotoFile=null;await saveMasterToSupabase(p);profiles.push(p);r.approved=false;count++}catch(e){failures.push(r.id+': '+e.message)}}nxBulkRender();$('nxBulkResults')?.insertAdjacentHTML('afterbegin',`<div class="notice">Created ${count} cloud profile(s). ${failures.length?esc(failures.join(' | ')):'No errors reported.'} Refresh the directory and confirm cloud persistence.</div>`)}finally{if(button.isConnected)button.disabled=false}}

// NEXUS-001: bookmarked section and inmate routes. The hash is not an authorization mechanism.
const nexusRouteSections=new Set([
  'dashboard','profiles','register','detail','personal','financialHub',
  'bulkIntake','facilities','records','search','reports','settings'
]);
function nexusHashFor(v){
  if((v==='detail'||v==='personal')&&detailId!=null){
    return '#/profiles/'+encodeURIComponent(String(detailId))+(v==='personal'?'/personal':'');
  }
  return '#/'+v;
}
function nexusResolveHash(){
  const hash=window.location.hash;
  if(!hash||hash==='#')return {view:'dashboard'};
  if(!hash.startsWith('#/'))return {view:'dashboard'};
  const path=hash.slice(2);
  const segments=path.split('/');
  if(segments[0]==='profiles'&&(segments.length===2||segments.length===3)){
    if(segments.length===3&&segments[2]!=='personal')return {view:'profiles'};
    let id;
    try{id=decodeURIComponent(segments[1]);}catch(_){return {view:'profiles'};}
    if(!id)return {view:'profiles'};
    const profile=profiles.find(p=>String(p.id)===id);
    // Never restore a record that is not in the authorized, loaded profile list.
    if(!profile)return {view:'profiles'};
    return {view:segments.length===3?'personal':'detail',id:String(profile.id)};
  }
  // Legacy detail/personal URLs have no inmate identifier and are not bookmarkable.
  if(path==='detail'||path==='personal'){
    return detailId!=null&&profiles.some(p=>String(p.id)===String(detailId))
      ? {view:path,id:String(detailId)} : {view:'profiles'};
  }
  return segments.length===1&&nexusRouteSections.has(path)
    ? {view:path} : {view:'dashboard'};
}
function nexusRenderCurrentHash(){
  // Signed-out or gateway-pending screens must never render protected content.
  if($('shell').classList.contains('hidden')||!nexusCloudReady||!currentUserId)return;
  const route=nexusResolveHash();
  if(route.id!=null)detailId=route.id;
  // Keep explicitly selected Personal File subtabs (including Financial Center) intact.
  view=route.view;
  const canonical=nexusHashFor(view);
  if(window.location.hash!==canonical){
    // Normalize invalid/legacy URLs without adding an extra history entry.
    history.replaceState(null,'',window.location.pathname+window.location.search+canonical);
  }
  render();
  window.scrollTo(0,0);
}
function go(v){
  if($('shell').classList.contains('hidden')||!nexusCloudReady||!currentUserId)return;
  if(!nexusRouteSections.has(v))return;
  if((v==='detail'||v==='personal')&&
      (detailId==null||!profiles.some(p=>String(p.id)===String(detailId)))){
    v='profiles';
  }
  const target=nexusHashFor(v);
  if(window.location.hash===target){
    // Same-URL navigation may still need to rerender, for example a different tab.
    view=v;
    render();
    window.scrollTo(0,0);
  }else{
    window.location.hash=target; // hashchange handles rendering, including browser history.
  }
}
window.addEventListener('hashchange',nexusRenderCurrentHash);

function nexusCollectGatewayCodes() {
  return new Promise((resolve, reject) => {
    const overlay = document.createElement('div');
    overlay.id = 'nexusGatewayEntry';
    overlay.style.cssText = `
      position:fixed;inset:0;z-index:999999;
      background:#07101df2;
      display:flex;align-items:center;
      justify-content:center;padding:20px;
    `;

    const panel = document.createElement('form');
    panel.style.cssText = `
      width:100%;max-width:390px;
      padding:30px;box-sizing:border-box;
      background:#142238;color:white;
      border:1px solid #607a99;
      border-radius:14px;
      font-family:Arial,sans-serif;
    `;

    const title = document.createElement('h2');
    title.textContent = 'BLACKCELL CORPORATION';

    const subtitle = document.createElement('p');
    subtitle.textContent = 'NEXUS Management System — Security Gateway';

    const access = document.createElement('input');
    access.type = 'password';
    access.placeholder = 'Access Code';
    access.autocomplete = 'off';
    access.required = true;
    access.maxLength = 256;

    const security = document.createElement('input');
    security.type = 'password';
    security.placeholder = 'Security Code';
    security.autocomplete = 'off';
    security.required = true;
    security.maxLength = 256;

    for (const field of [access, security]) {
      field.style.cssText = `
        display:block;width:100%;box-sizing:border-box;
        margin:14px 0;padding:12px;border-radius:7px;
        border:1px solid #71829b;
      `;
    }

    const continueButton = document.createElement('button');
    continueButton.type = 'submit';
    continueButton.textContent = 'Continue to Sign In';
    continueButton.style.cssText = `
      width:100%;padding:13px;background:#3277c5;
      color:white;border:0;border-radius:7px;cursor:pointer;
    `;

    const cancel = document.createElement('button');
    cancel.type = 'button';
    cancel.textContent = 'Cancel';
    cancel.style.cssText = `
      margin-top:12px;width:100%;padding:10px;cursor:pointer;
    `;

    const close = () => {
      access.value = '';
      security.value = '';
      overlay.remove();
    };

    cancel.onclick = () => {
      close();
      reject(new Error('Gateway entry cancelled'));
    };

    panel.onsubmit = event => {
      event.preventDefault();
      const codes = {
        accessCode: access.value,
        securityCode: security.value
      };
      close();
      resolve(codes);
    };

    panel.append(title, subtitle, access, security, continueButton, cancel);
    overlay.appendChild(panel);
    document.body.appendChild(overlay);
    access.focus();
  });
}

async function nexusVerifyGatewayCodes(codes) {
  if (
    !codes ||
    typeof codes.accessCode !== 'string' ||
    typeof codes.securityCode !== 'string' ||
    !codes.accessCode ||
    !codes.securityCode
  ) {
    throw new Error('Both security codes are required.');
  }

  try {
    const { data, error } = await nexusDB.functions.invoke(
      'nexus-gateway-verify',
      {
        body: {
          accessCode: codes.accessCode,
          securityCode: codes.securityCode
        }
      }
    );
    if (error || data?.verified !== true) {
      throw new Error('NEXUS gateway verification failed.');
    }
    await nexusRequireGatewayGrant();
    return true;
  } finally {
    codes.accessCode = '';
    codes.securityCode = '';
  }
}

async function nexusRequireGatewayGrant(){
  const {data, error} = await nexusDB.rpc(
    'nexus_gateway_session_valid'
  );
  if(error){
    throw new Error('Unable to check NEXUS gateway authorization.');
  }
  if(data !== true){
    throw new Error('NEXUS security codes must be verified before accessing records.');
  }
  return true;
}

async function nexusOpenAuthorizedSession(){
  const {data:{user},error}=await nexusDB.auth.getUser();
  if(error || !user){nexusShowSignedOut();return false;}
  try{
    await nexusRequireGatewayGrant();
    await loadMasterRecords();
  }catch(err){
    nexusShowSignedOut('Unable to access records: '+err.message);
    return false;
  }

  $('login').classList.add('hidden');
  $('shell').classList.remove('hidden');

  // Authorization and cloud loading have completed; now restore the bookmarked page.
  nexusRenderCurrentHash();
  return true;

}

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  if (nexusSigningIn) return;

  nexusSigningIn = true;
  $('nexusSignInBtn').disabled = true;
  let codes = null;
  let signedIn = false;
  const inputs = $('loginForm').querySelectorAll('input');

  try {
    codes = await nexusCollectGatewayCodes();
    $('nexusAuthStatus').textContent = 'Verifying your account...';
    const { data, error } = await nexusDB.auth.signInWithPassword({
      email: inputs[0].value.trim(),
      password: inputs[1].value
    });
    inputs[1].value = '';
    if (error || !data?.user) throw new Error('Sign in failed.');
    signedIn = true;
    $('nexusAuthStatus').textContent = 'Verifying security gateway...';
    await nexusVerifyGatewayCodes(codes);
    const opened = await nexusOpenAuthorizedSession();
    if (!opened) throw new Error('Dashboard authorization failed.');
  } catch (err) {
    inputs[1].value = '';
    if (signedIn) {
      const { error: signOutError } = await nexusDB.auth.signOut();
      if (signOutError) console.error('NEXUS sign-out cleanup failed:',signOutError.code);
    }
    nexusShowSignedOut('Login or gateway verification was not completed.');
  } finally {
    if (codes) {
      codes.accessCode = '';
      codes.securityCode = '';
      codes = null;
    }
    nexusSigningIn = false;
    $('nexusSignInBtn').disabled = false;
  }
});

// NEXUS-005A: enlarge an already-authorized photo URL. No public URL or new storage access.
let nxPhotoReturnFocus=null;
document.addEventListener('click',event=>{
 const button=event.target.closest('.nx-photo-enlarge');
 if(!button)return;
 const image=button.querySelector('img');
 if(!image||!image.currentSrc&&!image.src)return;
 nxPhotoReturnFocus=button;
 const modal=document.getElementById('nxPhotoModal');
 const target=document.getElementById('nxPhotoModalImage');
 target.src=image.currentSrc||image.src;
 target.alt=image.alt||'Enlarged inmate photograph';
 modal.hidden=false;
 modal.querySelector('.nx-photo-modal-close').focus();
});
function nxClosePhotoModal(){
 const modal=document.getElementById('nxPhotoModal');
 if(!modal||modal.hidden)return;
 modal.hidden=true;
 document.getElementById('nxPhotoModalImage').removeAttribute('src');
 if(nxPhotoReturnFocus?.isConnected)nxPhotoReturnFocus.focus();
 nxPhotoReturnFocus=null;
}
document.addEventListener('click',event=>{
 if(event.target.id==='nxPhotoModal'||event.target.closest('.nx-photo-modal-close'))nxClosePhotoModal();
});
document.addEventListener('keydown',event=>{if(event.key==='Escape')nxClosePhotoModal()});
