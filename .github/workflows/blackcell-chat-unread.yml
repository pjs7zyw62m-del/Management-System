name: BLACKCELL iMessage Unread Notifications
on:
  pull_request:
    paths:
      - 'blackcell-chat-unread.*'
      - 'blackcell-os.js'
      - 'corporate-chat*.js'
      - 'tests/blackcell-chat-unread.test.mjs'
      - '.github/workflows/blackcell-chat-unread.yml'
permissions:
  contents: read
jobs:
  unread:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check blackcell-os.js && node --check corporate-chat.js && node --check corporate-chat-dock.js && node --check corporate-chat-live.js && node --test tests/blackcell-chat-unread.test.mjs
