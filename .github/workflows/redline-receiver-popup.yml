name: BLACKCELL REDLINE Receiver Popup Startup
on:
  push:
    branches: [main]
    paths: ['private-photo-ledger-receiver.js','private-photo-ledger-receiver-popup.css','private-photo-ledger.html','tests/redline-receiver-popup.test.mjs','.github/workflows/redline-receiver-popup.yml']
  workflow_dispatch:
jobs:
  receiver-popup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          node --check private-photo-ledger-receiver.js
          node --test tests/redline-receiver-popup.test.mjs
      - name: Verify receiver starts with a real DOM at desktop and phone widths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('private-photo-ledger.html').read_text()
          s=re.sub(r'<script\b[^>]*>.*?</script>','',s,flags=re.S|re.I)
          probe="""<script>
          const errors=[];
          window.addEventListener('error',e=>errors.push(e.message));
          const q=id=>document.getElementById(id);
          for(const id of ['ledgerApp','ownerSetup','activeRoom','ownerReviewQueue'])q(id).hidden=false;
          q('employeeUpload').hidden=true;
          const mobile=innerWidth<600;
          document.body.classList.toggle('bc-ledger-mobile',mobile);
          document.body.dataset.ledgerView='summary';
          let entries=[];
          window.BLACKCELL_REDLINE_API={snapshot:()=>({isOwner:true,roomId:'fixture-room',roomActive:true,archiveMode:false,entries,pending:entries.length}),ownerAccessMembers:async()=>[]};
          </script><script src="private-photo-ledger-receiver.js"></script><script>
          const dash=q('redlineReceiverCommand'),chat=q('redlineReceiverChat'),work=q('redlineReceiverLiveWorkspace'),resume=q('redlineReceiverResumeReview');
          const report=()=>{document.body.dataset.popupTest=String(errors.length===0&&!!dash&&!dash.hidden&&chat.parentNode===dash&&!!resume&&!resume.hidden&&!!work&&work.classList.contains('rr-media-closed'));
          entries=[{id:'fixture-photo',decision_status:'pending'}];window.dispatchEvent(new Event('blackcell:redline:state'));
          document.body.dataset.autoOpen=String(work.classList.contains('rr-media-open')&&chat.parentNode===dash);
          resume.click();document.body.dataset.minimize=String(work.classList.contains('rr-media-closed')&&chat.parentNode===dash);
          window.dispatchEvent(new Event('blackcell:redline:state'));
          document.body.dataset.staysMinimized=String(work.classList.contains('rr-media-closed'));
          document.body.dataset.errors=errors.join(';');};setTimeout(report,300);
          </script>"""
          Path('receiver-popup-fixture.html').write_text(s.replace('</body>',probe+'</body>'))
          PY
          CHROME=$(command -v google-chrome || command -v chromium)
          for size in 1280,900 390,760; do
            "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --window-size="$size" --virtual-time-budget=3000 --dump-dom "file://$PWD/receiver-popup-fixture.html" > "/tmp/popup-$size.html"
            grep -q 'data-popup-test="true"' "/tmp/popup-$size.html"
            grep -q 'data-auto-open="true"' "/tmp/popup-$size.html"
            grep -q 'data-minimize="true"' "/tmp/popup-$size.html"
            grep -q 'data-stays-minimized="true"' "/tmp/popup-$size.html"
          done
