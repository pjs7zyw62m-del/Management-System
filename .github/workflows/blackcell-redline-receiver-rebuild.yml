name: BLACKCELL REDLINE Receiver and Fresh Session
on:
  pull_request:
    paths:
      - 'private-photo-ledger.html'
      - 'private-photo-ledger.js'
      - 'private-photo-ledger-receiver.js'
      - 'private-photo-ledger-receiver.css'
      - 'private-photo-ledger-responsive.js'
      - 'private-photo-ledger-simple-sender.js'
      - 'private-photo-ledger-timers.js'
      - 'supabase/sql/blackcell_redline_start_fresh_archive.sql'
      - 'tests/redline-timer-chat-browser-smoke.mjs'
      - 'tests/redline-per-second-earnings.test.mjs'
      - 'tests/redline-history-chat-signals.test.mjs'
      - 'tests/redline-chat-read-typing-browser-smoke.mjs'
      - 'tests/redline-timer-two-party-browser-smoke.mjs'
      - 'tests/redline-currently-viewing-browser-smoke.mjs'
      - 'tests/redline-next-photo-visual-smoke.mjs'
      - 'tests/redline-timer-stop-next-photo.test.mjs'
      - 'tests/redline-partial-payments.test.mjs'
      - 'tests/redline-photo-history-browser-smoke.mjs'
      - 'tests/blackcell-redline-receiver-reset.test.mjs'
      - '.github/workflows/blackcell-redline-receiver-rebuild.yml'
  push:
    branches: [main]
    paths:
      - 'private-photo-ledger.html'
      - 'private-photo-ledger.js'
      - 'private-photo-ledger-receiver.js'
      - 'private-photo-ledger-receiver.css'
      - 'private-photo-ledger-imessage-workspace.css'
      - 'private-photo-ledger-timers.js'
      - 'private-photo-ledger-timers.css'
      - 'private-photo-ledger-sender.js'
      - 'private-photo-ledger-simple-sender.css'
      - 'tests/blackcell-redline-receiver-reset.test.mjs'
      - 'tests/private-photo-ledger-sender.test.mjs'
      - 'tests/private-photo-ledger-simple-sender.test.mjs'
      - 'tests/redline-timer-chat-browser-smoke.mjs'
      - 'tests/redline-per-second-earnings.test.mjs'
      - 'tests/redline-history-chat-signals.test.mjs'
      - 'tests/redline-chat-read-typing-browser-smoke.mjs'
      - 'tests/redline-timer-two-party-browser-smoke.mjs'
      - 'tests/redline-currently-viewing-browser-smoke.mjs'
      - 'tests/redline-next-photo-visual-smoke.mjs'
      - 'tests/redline-timer-stop-next-photo.test.mjs'
      - 'tests/redline-partial-payments.test.mjs'
      - 'tests/redline-photo-history-browser-smoke.mjs'
      - '.github/workflows/blackcell-redline-receiver-rebuild.yml'
  workflow_dispatch:
jobs:
  redline-receiver-reset:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate REDLINE application JavaScript
        run: |
          node --check private-photo-ledger.js
          node --check private-photo-ledger-responsive.js
          node --check private-photo-ledger-simple-sender.js
          node --check private-photo-ledger-receiver.js
          node --check private-photo-ledger-sender.js
          node --check private-photo-ledger-timers.js
      - name: Receiver redesign, owner-only fresh session and existing sender tests
        run: |
          node --test \
            tests/blackcell-redline-receiver-reset.test.mjs \
            tests/redline-per-second-earnings.test.mjs \
            tests/redline-timer-stop-next-photo.test.mjs \
            tests/redline-partial-payments.test.mjs \
            tests/redline-history-chat-signals.test.mjs \
            tests/private-photo-ledger-responsive.test.mjs \
            tests/private-photo-ledger-mobile.test.mjs \
            tests/private-photo-ledger-sender.test.mjs \
            tests/private-photo-ledger-simple-sender.test.mjs \
            tests/private-photo-ledger-solid-red.test.mjs \
            tests/blackcell-redline-only-security-level.test.mjs
      - name: Browser smoke for receiver desktop, iPad and iPhone
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome >/dev/null 2>&1 && CHROME=google-chrome || { command -v chromium >/dev/null 2>&1 && CHROME=chromium || CHROME=; }
          [ -n "$CHROME" ] || { echo "Chromium unavailable"; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('private-photo-ledger.html').read_text()
          # Isolated visual-only preview: no auth, uploads, resets or external backend.
          html=re.sub(r'<script\b[^>]*>.*?</script>', '',html, flags=re.I|re.S)
          scripts='<script src="private-photo-ledger-responsive.js?v=20261121-stable-brand1" defer></script><script src="private-photo-ledger-receiver.js?v=20261121-receiver2" defer></script>'
          html=html.replace('</head>',scripts+'</head>')
          probe=r"""<script>
          window.addEventListener('error',e=>{document.body.dataset.previewError=String(e?.message||'error').replace(/[^a-z0-9_]/gi,'_').slice(0,140)});
          setTimeout(()=>{
            // Unauthenticated visual-only preview: no Supabase writes, no form submissions.
            const app=document.getElementById('ledgerApp');
            const owner=document.getElementById('ownerSetup');
            const room=document.getElementById('activeRoom');
            const gate=document.getElementById('accessGate');
            gate.hidden=true;app.hidden=false;owner.hidden=false;room.hidden=false;
            window.dispatchEvent(new Event('blackcell:redline:state'));
            const badge=document.getElementById('roomStateLabel');
            if(badge)badge.textContent='PREVIEW ONLY';
            setTimeout(()=>{
              const deck=document.getElementById('redlineReceiverCommand');
              document.body.dataset.receiverVisible=String(Boolean(deck&&!deck.hidden));
              document.body.dataset.receiverCards=String(deck?.querySelectorAll('.rr-stat').length===4);
              document.body.dataset.receiverOwner=String(document.body.classList.contains('bc-redline-receiver'));
              document.body.dataset.receiverArchiveControl=String(Boolean(document.getElementById('redlineMasterReset')&&document.getElementById('redlineArchiveToggle')));
              document.body.dataset.receiverBrand=String(Boolean(document.querySelector('.bc-ledger-edition')?.textContent==='PRIVATE EXCHANGE'));
            },350);
          },1600);
          </script>"""
          html=html.replace('</body>',probe+'</body>')
          Path('private-photo-ledger-receiver-probe.html').write_text(html)
          PY
          python3 -m http.server 8876 >/tmp/bc-redline-http.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true; rm -f private-photo-ledger-receiver-probe.html' EXIT
          sleep 2
          mkdir -p /tmp/bc-redline-receiver-screens
          for device in desktop ipad iphone; do
            case "$device" in
              desktop) w=1440;h=900 ;;
              ipad) w=820;h=1090 ;;
              iphone) w=390;h=844 ;;
            esac
            "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --virtual-time-budget=7000 --window-size="$w,$h" --dump-dom \
              "http://127.0.0.1:8876/private-photo-ledger-receiver-probe.html" \
              >"/tmp/redline-$device.html" 2>"/tmp/redline-$device-errors.log"
            for check in receiver-visible receiver-cards receiver-owner receiver-archive-control receiver-brand; do
              grep -q "data-$check=\"true\"" "/tmp/redline-$device.html" || {
                echo "$device missing $check"
                grep -o 'data-receiver-[a-z-]*="[^"]*"' "/tmp/redline-$device.html" | head -n 15 || true
                grep -o '<section[^>]*id="redlineReceiverCommand"[^>]*>' "/tmp/redline-$device.html" | head -n 2 || true
                grep -o 'data-preview-error="[^"]*"' "/tmp/redline-$device.html" | head -n 2 || true
                tail -n 20 "/tmp/redline-$device-errors.log"
                exit 1;
              }
            done
            "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --virtual-time-budget=7000 --window-size="$w,$h" \
              --screenshot="/tmp/bc-redline-receiver-screens/$device.png" \
              "http://127.0.0.1:8876/private-photo-ledger-receiver-probe.html" >/dev/null 2>&1
            echo "REDLINE $device: receiver dashboard and stable branding passed"
          done
      - name: Sender chat timer START and STOP browser integration
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome >/dev/null 2>&1 && CHROME=google-chrome || { command -v chromium >/dev/null 2>&1 && CHROME=chromium || CHROME=; }
          [ -n "$CHROME" ] || { echo "Chromium unavailable"; exit 1; }
          CHROME="$CHROME" node tests/redline-timer-chat-browser-smoke.mjs
      - name: Receiver and sender see timer START/STOP in their own chat
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome >/dev/null 2>&1 && CHROME=google-chrome || { command -v chromium >/dev/null 2>&1 && CHROME=chromium || CHROME=; }
          [ -n "$CHROME" ] || { echo "Chromium unavailable"; exit 1; }
          CHROME="$CHROME" node tests/redline-timer-two-party-browser-smoke.mjs
      - name: Sender Currently Viewing tracks the receiver-selected private photograph
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome >/dev/null 2>&1 && CHROME=google-chrome || { command -v chromium >/dev/null 2>&1 && CHROME=chromium || CHROME=; }
          [ -n "$CHROME" ] || { echo "Chromium unavailable"; exit 1; }
          CHROME="$CHROME" node tests/redline-currently-viewing-browser-smoke.mjs
      - name: Receiver and sender see read receipts and live typing
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome >/dev/null 2>&1 && CHROME=google-chrome || { command -v chromium >/dev/null 2>&1 && CHROME=chromium || CHROME=; }
          [ -n "$CHROME" ] || { echo "Chromium unavailable"; exit 1; }
          CHROME="$CHROME" node tests/redline-chat-read-typing-browser-smoke.mjs
      - name: Verify NEXT pending photo stays visible after previous timed selection
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome >/dev/null 2>&1 && CHROME=google-chrome || { command -v chromium >/dev/null 2>&1 && CHROME=chromium || CHROME=; }
          [ -n "$CHROME" ] || { echo "Chromium unavailable"; exit 1; }
          CHROME="$CHROME" node tests/redline-next-photo-visual-smoke.mjs
      - name: Verify Photo History opens, scrolls and closes without resizing the current photo
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome >/dev/null 2>&1 && CHROME=google-chrome || { command -v chromium >/dev/null 2>&1 && CHROME=chromium || CHROME=; }
          [ -n "$CHROME" ] || { echo "Chromium unavailable"; exit 1; }
          CHROME="$CHROME" node tests/redline-photo-history-browser-smoke.mjs
      - name: Archive REDLINE receiver previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackcell-redline-receiver-preview
          path: /tmp/bc-redline-receiver-screens/*.png
          if-no-files-found: ignore
          retention-days: 7
