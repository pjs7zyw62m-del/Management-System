name: BLACKCELL Internal Mail
on:
  pull_request:
    paths:
      - 'blackcell-mail.*'
      - 'blackcell-os.js'
      - 'database/blackcell-internal-mail.sql'
      - 'tests/blackcell-internal-mail.test.mjs'
      - '.github/workflows/blackcell-internal-mail.yml'
permissions:
  contents: read
jobs:
  mail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check blackcell-mail.js && node --check blackcell-os.js && node --test tests/blackcell-internal-mail.test.mjs
