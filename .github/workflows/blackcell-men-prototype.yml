name: BLACKCELL MEN Prototype Integrity
on:
  push:
    paths:
      - 'blackcell-men-prototype.html'
      - 'blackcell-os.js'
      - 'tests/blackcell-men-prototype.test.mjs'
      - '.github/workflows/blackcell-men-prototype.yml'
  pull_request:
    paths:
      - 'blackcell-men-prototype.html'
      - 'blackcell-os.js'
      - 'tests/blackcell-men-prototype.test.mjs'
      - '.github/workflows/blackcell-men-prototype.yml'
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate BLACKCELL MEN prototype
        run: node --test tests/blackcell-men-prototype.test.mjs
