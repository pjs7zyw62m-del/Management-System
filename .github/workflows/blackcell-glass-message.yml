name: BLACKCELL Glass Messages
on:
  pull_request:
    paths:
      - 'corporate-chat.js'
      - 'corporate-chat.html'
      - 'corporate-chat-glass-message.css'
      - 'tests/blackcell-glass-message.test.mjs'
      - '.github/workflows/blackcell-glass-message.yml'
permissions:
  contents: read
jobs:
  glass-message:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check corporate-chat.js && node --test tests/blackcell-glass-message.test.mjs
