name: BLACKCELL AI Core Pilot Tests
on:
  pull_request:
    paths:
      - 'integrations/blackcell-ai-core/**'
      - '.github/workflows/blackcell-ai-core-pilot-test.yml'
  workflow_dispatch:
jobs:
  offline-gateway-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: integrations/blackcell-ai-core/requirements.txt
      - name: Install pinned gateway dependencies
        run: |
          python -m pip install -r integrations/blackcell-ai-core/requirements.txt
          python -m pip install pytest==8.4.2
      - name: Verify secure gateway without GPU or real media
        working-directory: integrations/blackcell-ai-core
        run: pytest -q test_app.py
