name: BLACKCELL Mobile Store Editorial
on:
  pull_request:
    paths:
      - 'blackcell-app-store.js'
      - 'blackcell-app-store-grid.css'
      - 'blackcell-os.html'
      - 'tests/blackcell-mobile-store-editorial.test.mjs'
      - '.github/workflows/blackcell-mobile-store-editorial.yml'
  push:
    branches: [main]
    paths:
      - 'blackcell-app-store.js'
      - 'blackcell-app-store-grid.css'
      - 'blackcell-os.html'
      - 'tests/blackcell-mobile-store-editorial.test.mjs'
      - '.github/workflows/blackcell-mobile-store-editorial.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  storefront:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          command -v google-chrome >/dev/null 2>&1 && export CHROME=google-chrome || export CHROME=chromium
          node --check blackcell-app-store.js
          node --test tests/blackcell-mobile-store-editorial.test.mjs
