name: BLACKCELL OS Device Naming
on:
  pull_request:
    paths:
      - 'blackcell-os.html'
      - 'blackcell-os-device-label.js'
      - 'blackcell-os-device-label.css'
      - 'tests/blackcell-os-device-label.test.mjs'
      - '.github/workflows/blackcell-os-device-label.yml'
  push:
    branches: [main]
    paths:
      - 'blackcell-os.html'
      - 'blackcell-os-device-label.js'
      - 'corporate-chat.html'
      - 'corporate-chat.js'
      - 'employee.js'
      - 'employee.html'
      - 'tests/blackcell-android-session-preserve.test.mjs'
      - 'corporate-chat-media.js'
      - 'corporate-chat-compact-media.css'
      - 'tests/blackcell-android-attachments.test.mjs'
      - 'tests/blackcell-imessage-contact-boot.test.mjs'
      - 'corporate-chat-android-caret.js'
      - 'corporate-chat-obsidian.css'
      - 'tests/blackcell-android-ime.test.mjs'
      - 'tests/blackcell-android-caret-recovery.test.mjs'
      - 'tests/blackcell-os-device-label.test.mjs'
      - '.github/workflows/blackcell-os-device-label.yml'
  workflow_dispatch:
jobs:
  device-naming:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax and naming checks
        run: |
          node --check blackcell-os-device-label.js
          node --test tests/blackcell-os-device-label.test.mjs
          node --check corporate-chat.js
          node --check corporate-chat-media.js
          node --check employee.js
          node --test tests/blackcell-android-session-preserve.test.mjs
          node --check corporate-chat-android-caret.js
          node --test tests/blackcell-android-caret-recovery.test.mjs
      - name: Verify Android iMessage text entry and direction
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome >/dev/null 2>&1 && CHROME=google-chrome || { command -v chromium >/dev/null 2>&1 && CHROME=chromium || CHROME=; }
          [ -n "$CHROME" ] || { echo "Chromium unavailable"; exit 1; }
          CHROME="$CHROME" node --test tests/blackcell-android-ime.test.mjs
          CHROME="$CHROME" node --test tests/blackcell-android-attachments.test.mjs
          CHROME="$CHROME" node --test tests/blackcell-imessage-contact-boot.test.mjs
      - name: Render device labels with Chromium
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome >/dev/null 2>&1 && CHROME=google-chrome || { command -v chromium >/dev/null 2>&1 && CHROME=chromium || CHROME=; }
          [ -n "$CHROME" ] || { echo "Chromium unavailable"; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          s=Path('blackcell-os.html').read_text()
          assert 'data-preview="false"' in s
          s=s.replace('data-preview="false"','data-preview="true"',1)
          Path('blackcell-os-device-naming-smoke.html').write_text(s)
          PY
          python3 -m http.server 8765 >/tmp/blackcell-device-server.log 2>&1 &
          HTTP_PID=$!
          trap 'kill "$HTTP_PID" 2>/dev/null || true; rm -f blackcell-os-device-naming-smoke.html' EXIT
          sleep 2
          for device in desktop tablet mobile android android11 androidtablet11; do
            case "$device" in
              desktop) width=1440; height=900; label="BLACKCELL OS"; set -- ;;
              tablet) width=820; height=1180; label="BLACKCELL OS Tablet"; set -- '--user-agent=Mozilla/5.0 (iPad; CPU OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/604.1' ;;
              mobile) width=390; height=844; label="BLACKCELL OS Mobile"; set -- '--user-agent=Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/604.1' ;;
              android) width=390; height=844; label="BLACKCELL OS Mobile · Android"; set -- '--user-agent=Mozilla/5.0 (Linux; Android 15; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/135.0.0.0 Mobile Safari/537.36' ;;
              android11) width=360; height=740; label="BLACKCELL OS Mobile · Android"; set -- '--user-agent=Mozilla/5.0 (Linux; Android 11; Neon Smarta 2) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/110.0.0.0 Mobile Safari/537.36' ;;
              androidtablet11) width=820; height=1180; label="BLACKCELL OS Tablet · Android"; set -- '--user-agent=Mozilla/5.0 (Linux; Android 11; SM-T500) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/110.0.0.0 Safari/537.36' ;;
            esac
            "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --virtual-time-budget=11000 --window-size="$width,$height" "$@" --dump-dom "http://127.0.0.1:8765/blackcell-os-device-naming-smoke.html" > "/tmp/blackcell-name-$device.html" 2>/tmp/blackcell-device-errors.log
            grep -Fq "<title>$label</title>" "/tmp/blackcell-name-$device.html"
            grep -Fq "data-blackcell-os-name=\"$label\"" "/tmp/blackcell-name-$device.html"
            grep -Fq "name=\"apple-mobile-web-app-title\" content=\"$label\"" "/tmp/blackcell-name-$device.html"
            echo "$device detected automatically: $label"
          done
